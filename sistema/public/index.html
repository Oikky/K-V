<!-- Sistema K&V: página única. Trocar de tela não recarrega nada; o endereço muda (/orcamento.html?id=4) e voltar funciona.

     MAPA PRA MEXER
     Cada tela é um arquivo de código e um de estilo, em telas/:
       orcamentos       Fila de orçamentos (quem vê: todos)  →  telas/orcamentos.js e telas/orcamentos.css
       novo-orcamento   Novo orçamento (quem vê: dono)  →  telas/novo-orcamento.js e telas/novo-orcamento.css
       orcamento        Pesquisa de voos de um orçamento (quem vê: todos)  →  telas/orcamento.js e telas/orcamento.css
       proposta         Proposta (combinações e mensagem) (quem vê: dono)  →  telas/proposta.js e telas/proposta.css
       fechamento       Fechamento (aceita, quem paga, quem voa, recebimento) (quem vê: dono)  →  telas/fechamento.js e telas/fechamento.css
       emissao          Emissão (um registro por voo) (quem vê: dono)  →  telas/emissao.js e telas/emissao.css
       contas           Lista de contas de pontos (quem vê: dono)  →  telas/contas.js e telas/contas.css
       conta            Uma conta: extrato e beneficiários (quem vê: dono)  →  telas/conta.js e telas/conta.css
       entrada          Registrar entrada de pontos (quem vê: dono)  →  telas/entrada.js e telas/entrada.css
       saida            Registrar saída de pontos (quem vê: dono)  →  telas/saida.js e telas/saida.css
       nova-conta       Nova conta de pontos (quem vê: dono)  →  telas/nova-conta.js e telas/nova-conta.css
       clientes         Clientes e passageiros (quem vê: dono)  →  telas/clientes.js e telas/clientes.css
       pessoa           Ficha de uma pessoa (quem vê: dono)  →  telas/pessoa.js e telas/pessoa.css
       ponto            Ponto do pesquisador (cronômetro) (quem vê: quem pesquisa)  →  telas/ponto.js e telas/ponto.css
       folha            Folha do ponto (pagamento das semanas) (quem vê: dono)  →  telas/folha.js e telas/folha.css
       programas        Configurações dos programas (quem vê: dono)  →  telas/programas.js e telas/programas.css

     Peças que várias telas usam, em shared/:
       base.css        cores, letras e peças visuais aprovadas (docs/direcao-visual.md)
       rota.js         troca de tela: links, voltar, e desliga o que a tela ligou quando ela sai
       shell.js        menu lateral, tema, "ver como" do admin, janelas que entram no histórico, avisos
       api.js          conversa com o servidor (leituras guardadas na aba, gravações por KVApi.acao)
       orc.js          aeroportos, etapas, datas, dinheiro e a trilha do orçamento
       proposta.js     contas da proposta, fechamento e emissão (preço, milhas, recebimento)
       contas.js       contas de pontos (saldo, lotes, beneficiários)
       pessoas.js      clientes e viagens
       ponto.js        ponto dos pesquisadores
       combo.js        lista longa vira busca
       pessoa-form.js  janela de nova pessoa / editar dados
     O servidor (o que grava e o que cada papel pode ver) fica em sistema/src/. -->
