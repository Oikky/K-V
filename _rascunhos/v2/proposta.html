<!doctype html>
<html lang="pt-BR" data-theme="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proposta · K&amp;V (rascunho A/B/C)</title>
<!-- RASCUNHO DESCARTÁVEL: onde a proposta abre no PC. A = na janela do cartão, com abas; B = página própria; C = gaveta à direita. Dados fictícios. -->
<link rel="stylesheet" href="../../sistema/public/shared/base.css">
<link rel="stylesheet" href="../../sistema/public/telas/orcamentos.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- folha do recibo: tem os dados da empresa, fica fora do git (gerar com extrai.py a partir do recibo-kv) -->
<script src="../../.superpowers/recibo-atual/recibo-folha.js"></script>
<style>
  body { font-size: 14px; }
  :root { --eo: cubic-bezier(0.23, 1, 0.32, 1); }
  /* ---------- carregando (igual ao quadro) ---------- */
  .carregando { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--bg); transition: opacity .35s var(--eo), visibility .35s; }
  .carregando.fora { opacity: 0; visibility: hidden; }
  .carregando.leve { background: rgb(1 14 31 / .55); }
  .anel { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
  .anel::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 55%, var(--orange) 100%); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); animation: gira .9s linear infinite; }
  .anel img { width: 92px; height: 92px; border-radius: 50%; object-fit: cover; }
  @keyframes gira { to { rotate: 360deg; } }

  /* ---------- casca e quadro (versão D do quadro, enxuta) ---------- */
  .casca { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 100dvh; }
  .menu { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; gap: 4px; padding: 14px 10px; background: var(--surface-1); border-right: 1px solid var(--line); }
  .menu .marca { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; text-decoration: none; }
  .menu .marca img { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; }
  .menu .marca b { font: 800 18px/1 var(--font-brand); } .menu .marca b i { color: var(--orange); font-style: normal; }
  .menu .marca small { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 3px; }
  .menu a.pg { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 10px; color: var(--text-2); text-decoration: none; font-weight: 600; }
  .menu a.pg svg { width: 17px; } .menu a.pg:hover { background: var(--surface-2); color: var(--text); }
  .menu a.pg[aria-current] { background: var(--surface-3); color: var(--text); }
  .pagina { min-width: 0; padding: 20px 26px 32px; }
  .topo { display: flex; align-items: center; gap: 18px; margin: 0; }
  .topo h1 { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
  .topo .novo { margin-left: auto; height: 40px; padding: 0 18px; border-radius: var(--r-pill); border: 0; background: var(--orange); color: var(--orange-ink); font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
  .topo .novo svg { width: 17px; }
  .busca-g { position: relative; display: block; margin: 16px 0 18px; }
  .busca-g svg { position: absolute; left: 16px; top: 50%; translate: 0 -50%; width: 18px; color: var(--text-3); }
  .busca-g input { width: 100%; height: 44px; padding: 0 16px 0 46px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--surface-1); font-size: 14.5px; }
  .colunas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .col { background: var(--surface-1); border-radius: 24px; padding: 14px; display: flex; flex-direction: column; gap: 10px; --bg: var(--surface-1); }
  .col-cab { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px; }
  .col-cab h2 { font-size: 15px; font-weight: 700; }
  .col-cab .n { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--text-2); }
  .col-cab .ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--cbg); color: var(--c); } .col-cab .ic svg { width: 16px; }
  .ca { cursor: pointer; background: var(--surface-2); padding: 14px; border-radius: 20px; gap: 9px; transition: background .15s; }
  .ca:hover { background: var(--surface-3); } .ca:hover .canto { background: var(--bg); }
  .ca .canto { width: 52px; height: 52px; } .ca .canto::after { left: 36px; top: 52px; }
  .ca .canto button { width: 40px; height: 40px; border-radius: 13px; background: var(--surface-2); }
  .ca .nome { font-size: 20px; }
  .trilho { display: flex; gap: 4px; } .trilho i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-3); } .trilho i.ok { background: var(--teal-soft); }
  .trilho-t { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); margin-top: -3px; }
  .ca .pra-voce { color: var(--orange); font-weight: 700; }

  /* ---------- botões comuns ---------- */
  .bt { height: 36px; padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; text-decoration: none; color: var(--text); }
  .bt:hover { background: var(--surface-3); } .bt svg { width: 16px; }
  .bt.pri { background: var(--orange); color: var(--orange-ink); border-color: transparent; } .bt.pri:hover { filter: brightness(1.06); }
  .bt.fant { background: none; border-color: transparent; color: var(--text-2); } .bt.fant:hover { color: var(--text); background: var(--surface-2); }
  .bt:active { transform: scale(.97); } .bt { transition: transform .12s var(--eo), background-color .15s; }
  .btn-x { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; cursor: pointer; flex: none; }
  .btn-x:hover { background: var(--surface-3); } .btn-x svg { width: 18px; }
  :focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

  /* ---------- A: janela por cima / C: gaveta ---------- */
  .veu { position: fixed; inset: 0; z-index: 40; background: rgb(1 8 18 / .62); display: grid; place-items: center; padding: 24px; opacity: 0; transition: opacity .2s; }
  .veu.aberto { opacity: 1; }
  .jan { width: min(1240px, 100%); height: calc(100dvh - 48px); display: flex; flex-direction: column; background: var(--surface-1); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-pop); overflow: hidden; translate: 0 10px; scale: .985; transition: translate .25s var(--eo), scale .25s var(--eo); }
  .veu.aberto .jan { translate: 0 0; scale: 1; }
  .veu.gaveta { place-items: stretch end; padding: 0; background: rgb(1 8 18 / .45); }
  .gaveta .jan { width: min(900px, calc(100% - 80px)); height: 100dvh; border-radius: 22px 0 0 22px; border-right: 0; translate: 48px 0; scale: 1; }
  .veu.aberto.gaveta .jan { translate: 0 0; }
  .j-topo { display: flex; align-items: center; gap: 12px; padding: 14px 18px 0; }
  .j-topo h2 { font-size: 20px; font-weight: 700; } .j-topo h2 span { color: var(--text-3); font-weight: 600; }
  .j-topo .sub { color: var(--text-2); font-size: 13px; margin-top: 2px; }
  .j-topo .btn-x { margin-left: auto; }
  /* abas do orçamento: Pesquisa · Proposta · Fechamento · Emissão */
  .abas { position: relative; display: flex; gap: 4px; padding: 10px 18px 0; border-bottom: 1px solid var(--line); }
  .aba { all: unset; position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 9px 12px 11px; font-weight: 700; color: var(--text-2); cursor: pointer; border-radius: 10px 10px 0 0; }
  .aba svg { width: 15px; } .aba:hover { color: var(--text); }
  .aba[aria-selected="true"] { color: var(--text); }
  .aba .ok { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-bg); color: var(--ok); } .aba .ok svg { width: 11px; }
  .abas .risca { position: absolute; bottom: -1px; left: 0; height: 2px; border-radius: 2px; background: var(--orange); transition: transform .3s var(--eo), width .3s var(--eo); }
  .j-corpo { flex: 1; min-height: 0; overflow: auto; background: var(--bg); }
  .em-breve { display: grid; place-items: center; gap: 8px; text-align: center; height: 100%; color: var(--text-2); padding: 40px; }
  .em-breve svg { width: 30px; color: var(--text-3); } .em-breve b { color: var(--text); font-size: 16px; }

  /* ---------- B: página própria ---------- */
  .pg-prop { display: flex; flex-direction: column; gap: 14px; }
  .pg-prop .volta { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-weight: 700; align-self: flex-start; }
  .pg-prop .volta:hover { color: var(--text); } .pg-prop .volta svg { width: 16px; }
  .pg-cab { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .pg-cab h1 { font-size: 26px; font-weight: 700; } .pg-cab h1 span { color: var(--text-3); font-weight: 600; }
  .pg-cab .sub { color: var(--text-2); margin-top: 2px; }
  .passos { margin-left: auto; display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; color: var(--text-3); }
  .passos span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r-pill); }
  .passos .feito { color: var(--ok); } .passos .agora { background: var(--orange-soft); color: var(--orange); }
  .passos svg { width: 14px; }
  .pg-prop .prop { padding: 0; }
  .pg-prop.entra > * { animation: sobe .34s var(--eo) both; } .pg-prop.entra > :nth-child(2) { animation-delay: .04s; } .pg-prop.entra > :nth-child(3) { animation-delay: .08s; }

  /* ---------- a proposta em si (igual nas três) ---------- */
  .prop { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px 18px 20px; align-items: start; }
  .gaveta .prop { grid-template-columns: 1fr; }
  .resumo { grid-column: 1 / -1; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); }
  .resumo b { color: var(--text); font-size: 15px; } .resumo .salvo { margin-left: auto; color: var(--text-3); }
  .skyp { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: var(--r-pill); background: var(--surface-1); border: 1px solid var(--line); }
  .skyp svg { width: 15px; color: var(--teal-soft); }
  .combos { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; align-items: start; }
  .cb { background: var(--surface-1); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; animation: sobe .34s var(--eo) both; }
  .cb:nth-child(2) { animation-delay: .05s; } .cb:nth-child(3) { animation-delay: .1s; }
  @keyframes sobe { from { opacity: 0; transform: translateY(10px); } }
  .cb header { display: flex; align-items: center; gap: 9px; }
  .cb .nro { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--orange); color: var(--orange-ink); font-weight: 800; font-size: 13px; flex: none; }
  .cb header b { font-size: 16px; } .cb header .bt-mais { margin-left: auto; width: 32px; height: 32px; border-radius: 10px; border: 0; background: none; color: var(--text-2); display: grid; place-items: center; cursor: pointer; }
  .cb header .bt-mais:hover { background: var(--surface-2); color: var(--text); } .cb header .bt-mais svg { width: 17px; }
  /* um voo por trecho; clicar abre as outras opções do trecho embaixo dele */
  .trv { border-radius: 14px; background: var(--surface-2); overflow: hidden; transition: box-shadow .25s var(--eo); }
  .trv.aberto { box-shadow: inset 0 0 0 1px var(--orange); }
  .tr-l { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; align-items: center; padding: 9px 11px; cursor: pointer; }
  .tr-l:hover { background: var(--surface-3); } .tr-l:focus-visible { outline: 2px solid var(--orange); outline-offset: -2px; }
  .tr-l small { color: var(--text-2); font-size: 12px; } .tr-l b { font-size: 15.5px; font-variant-numeric: tabular-nums; }
  .tr-l .troca { grid-column: 2; grid-row: 1 / span 3; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--text-3); transition: transform .3s var(--eo), color .2s, background-color .2s; }
  .tr-l .troca svg { width: 15px; }
  .trv.aberto .troca { color: var(--orange); background: var(--orange-soft); transform: rotate(90deg); }
  .alts-w { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s var(--eo); }
  .trv.aberto .alts-w { grid-template-rows: 1fr; } .alts-w > div { min-height: 0; overflow: hidden; }
  .alts { padding: 4px 6px 8px; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); }
  .alts .mini { font-size: 11.5px; font-weight: 700; color: var(--text-3); padding: 6px 6px 2px; }
  .alt { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto; gap: 0 10px; padding: 7px 8px; border-radius: 10px; cursor: pointer; opacity: 0; transform: translateY(-4px); transition: opacity .12s, transform .2s var(--eo); }
  .trv.aberto .alt { opacity: 1; transform: none; transition: opacity .25s calc(.05s + var(--i) * .03s), transform .3s var(--eo) calc(.05s + var(--i) * .03s); }
  .alt:hover { background: var(--surface-3); } .alt:focus-visible { outline: 2px solid var(--orange); outline-offset: -2px; }
  .alt b { font-size: 14px; font-variant-numeric: tabular-nums; } .alt small { color: var(--text-2); font-size: 12px; }
  .alt .dif { grid-row: span 2; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; align-self: center; } .alt .dif.menos { color: var(--ok); }
  /* milhas por programa, com o valor da milha desta combinação */
  .mil { display: flex; flex-direction: column; gap: 6px; padding-top: 2px; }
  .ml { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
  .ml .q { font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; } .ml .q small { font-weight: 600; font-size: 12px; color: var(--text-2); margin-left: 3px; }
  .stp { display: inline-flex; justify-self: start; align-items: center; gap: 2px; padding: 2px; border-radius: var(--r-pill); background: var(--surface-2); }
  .stp button { width: 26px; height: 26px; border-radius: 50%; border: 0; background: none; color: var(--text-2); display: grid; place-items: center; cursor: pointer; } .stp button:hover { background: var(--surface-3); color: var(--text); }
  .stp button svg { width: 14px; } .stp span { min-width: 64px; text-align: center; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stp span.mudou { color: var(--orange); }
  .ml .eq { justify-self: end; font-size: 12.5px; color: var(--text-2); }
  .preco { border-top: 1px solid var(--line); padding-top: 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: end; }
  .preco .rot { white-space: nowrap; font-size: 12px; font-weight: 700; color: var(--text-3); } .preco .v { font-size: 24px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; grid-column: 1; }
  .preco .pp { grid-column: 2; grid-row: 1 / span 2; text-align: right; font-size: 12.5px; color: var(--text-2); }
  .preco .pp b { display: block; color: var(--text); font-size: 14px; white-space: nowrap; } .preco .pp b small { font-size: 12px; font-weight: 600; color: var(--text-2); } .preco .pp > span { white-space: nowrap; } .preco .pp .abaixo { color: var(--ok); } .preco .pp .acima { color: var(--warn); }
  .parc { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  .caixa { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid transparent; }
  .caixa:focus-within { border-color: var(--orange); } .caixa span { color: var(--text-3); font-weight: 700; } .caixa input { all: unset; width: 100%; font-variant-numeric: tabular-nums; }
  .parc select { height: 36px; border-radius: 10px; background: var(--surface-2); border: 0; padding: 0 10px; font-weight: 700; }
  .parc small { grid-column: 1 / -1; font-size: 12px; color: var(--text-3); }
  .nova { all: unset; box-sizing: border-box; min-height: 160px; border-radius: 20px; border: 1.5px dashed var(--line); display: grid; place-content: center; justify-items: center; gap: 6px; color: var(--text-2); font-weight: 700; cursor: pointer; }
  .nova:hover { border-color: var(--orange); color: var(--orange); } .nova svg { width: 22px; } .nova small { font-weight: 600; color: var(--text-3); }
  /* mensagem */
  .msg-l { position: sticky; top: 0; background: var(--surface-1); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg-l h3 { font-size: 15px; display: flex; align-items: baseline; gap: 8px; } .msg-l h3 small { color: var(--text-3); font-weight: 600; font-size: 12px; }
  .msg { white-space: pre-wrap; font-size: 13px; line-height: 1.5; max-height: 330px; overflow: auto; padding: 12px; border-radius: 14px; background: #0b2a24; color: #e7f3ee; scrollbar-width: thin; }
  .gaveta .msg { max-height: none; }
  .msg-acoes { display: flex; flex-wrap: wrap; gap: 8px; } .msg-acoes .bt.pri { flex: 1 1 100%; }
  .est { font-size: 13px; color: var(--text-2); padding: 10px 12px; border-radius: 12px; background: var(--ok-bg); } .est b { color: var(--ok); }


  /* ---------- 3 jeitos de mostrar as combinações ---------- */
  .prop .combos { gap: 12px; }
  .nova { min-height: 0; }
  .trv { align-self: start; }
  .combos .preco { grid-template-columns: 1fr; } .combos .preco .pp { grid-column: 1; grid-row: auto; text-align: left; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; } .combos .preco .pp b { display: inline; }
  .ml { grid-template-columns: minmax(0, 1fr) auto; } .ml .prog { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tr-l small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ml .eq { font-size: 12px; color: var(--text-3); }
  .parc small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 1 e 2: cada cartão usa as linhas da grade de fora, então cada parte fica na mesma altura em todos */
  .g1, .g2 { display: grid; grid-template-rows: repeat(var(--nl), auto); row-gap: 10px; column-gap: 12px; }
  .g1 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g1 > *, .g2 > * { grid-row: 1 / span var(--nl); }
  .g1 .cb, .g2 .cb, .g2 .rotulos { display: grid; grid-template-rows: subgrid; grid-template-columns: minmax(0, 1fr); row-gap: 10px; }
  .g1 .mil, .g2 .mil { align-self: start; }
  .g1 .nova, .g2 .nova { align-self: stretch; height: auto; }
  .g1 .preco, .g2 .preco { align-self: start; }
  /* 2: coluna de rótulos à esquerda */
  .g2 { grid-template-columns: 96px repeat(3, minmax(0, 1fr)); }
  .g2 .rotulos { padding: 14px 0; }
  .g2 .rotulos span { display: flex; flex-direction: column; justify-content: flex-start; gap: 1px; border-top: 1px solid var(--line); padding-top: 12px; }
  .g2 .rotulos span:first-child { border: 0; }
  .g2 .rotulos b { font-size: 13.5px; } .g2 .rotulos small { font-size: 11.5px; color: var(--text-3); }
  .g2 .preco { border-top: 0; padding-top: 0; }
  /* 3: uma linha por combinação */
  .prop.p3 { grid-template-columns: 1fr; } .p3 .msg-l { position: static; display: grid; grid-template-columns: minmax(0, 1fr) 260px; grid-template-rows: auto 1fr; column-gap: 16px; } .p3 .msg-l h3 { grid-column: 1 / -1; } .p3 .msg { max-height: 240px; } .p3 .msg-acoes { flex-direction: column; align-items: stretch; align-self: start; } .p3 .msg-acoes .bt { flex: none; }
  .g3 { display: grid; grid-template-columns: 170px repeat(2, minmax(0, 1fr)) 200px 240px; row-gap: 10px; column-gap: 10px; }
  .g3 > * { grid-column: 1 / -1; }
  .g3 .cab3, .g3 .cb { display: grid; grid-template-columns: subgrid; align-items: start; }
  .g3 .cab3 { padding: 0 14px; font-size: 12px; font-weight: 700; color: var(--text-3); } .g3 .cab3 small { font-weight: 600; margin-left: 4px; }
  .g3 .cb { padding: 12px 14px; }
  .g3 .cb header { flex-wrap: wrap; align-self: center; } .g3 .cb header b { flex: 1; min-width: 0; font-size: 15px; }
  .g3 .ml { grid-template-columns: 1fr; gap: 3px; } .g3 .ml .q { font-size: 15px; } .g3 .ml .eq { display: none; }
  .g3 .pr3 { display: flex; flex-direction: column; gap: 8px; }

</div>

<script>
// ---------- dados fictícios ----------
const PAX = 2;
const PROG = { smiles: { nome: 'Smiles', vm: 0.016 }, latam: { nome: 'Latam Pass', vm: 0.025 }, azul: { nome: 'TudoAzul', vm: 0.014 } };

// opção de voo: trecho, site, data, sai, chega, escalas, malas, milhas por pessoa, taxa por pessoa (centavos)
const OPS = [
  { id: 1, t: 0, site: 'Smiles', data: '2026-12-21', sai: '06:00', chega: '10:40', esc: 1, mala: 1, mi: 18500, tx: 6400 },
  { id: 2, t: 0, site: 'Latam', data: '2026-12-21', sai: '13:10', chega: '16:05', esc: 0, mala: 0, mi: 24000, tx: 7000 },
  { id: 3, t: 0, site: 'TudoAzul', data: '2026-12-22', sai: '08:20', chega: '12:55', esc: 1, mala: 1, mi: 21000, tx: 5800 },
  { id: 4, t: 1, site: 'Latam', data: '2027-01-05', sai: '14:20', chega: '19:05', esc: 1, mala: 1, mi: 21000, tx: 6400 },
  { id: 5, t: 1, site: 'Smiles', data: '2027-01-04', sai: '09:00', chega: '11:50', esc: 0, mala: 1, mi: 23500, tx: 6400 },

const SKY = 145000; // Skyscanner por pessoa, só pra comparar
let combos = [
  { nome: 'Mais barata', escolha: [1, 6], vm: {}, parc: null, vezes: 10 },
  { nome: 'Só voo direto', escolha: [2, 5], vm: {}, parc: 260000, vezes: 10 },

const ORC = [
  { id: 216, nome: 'Rafael Martins', etapa: 'novo', rota: 'BSB → SCL → BSB', sub: 'Santiago · 10–14 jan · 1 pessoa', tr: [0, 0], quem: 'sem ninguém' },
  { id: 217, nome: 'Otávio Nunes', etapa: 'novo', rota: 'GRU → CDG → GRU', sub: 'Paris · 01–07 mai · 2 pessoas', tr: [0, 0], quem: 'sem ninguém' },
  { id: 214, nome: 'Marina Ribeiro', etapa: 'pesquisa', rota: 'GRU → LIS → MAD → GRU', sub: 'Lisboa e Madri · 12–18 jan · 2 pessoas', tr: [1, 1, 0], quem: 'com Bruna' },
  { id: 211, nome: 'Jorge Almeida', etapa: 'pesquisa', rota: 'GRU → EZE → GRU', sub: 'Buenos Aires · 14–20 abr · 2 pessoas', tr: [1, 0], quem: 'com Caio' },
  { id: 209, nome: 'Ana Luiza Prado', etapa: 'pesquisado', rota: 'POA → SSA → POA', sub: 'Salvador · 20–27 dez · 2 pessoas', tr: [1, 1], quem: 'pra você revisar' },
  { id: 207, nome: 'Carla Menezes', etapa: 'pesquisado', rota: 'CWB → REC', sub: 'Recife · 08–15 jan · 1 pessoa', tr: [1], quem: 'pra você revisar' },
];
const COLS = [{ id: 'novo', nome: 'Novos', ic: 'inbox', c: 'var(--warn)', cbg: 'var(--warn-bg)' }, { id: 'pesquisa', nome: 'Em pesquisa', ic: 'search', c: 'var(--orange)', cbg: 'var(--orange-soft)' }, { id: 'pesquisado', nome: 'Pesquisados', ic: 'check', c: 'var(--ok)', cbg: 'var(--ok-bg)' }];

// ---------- contas ----------
const $ = (s, el = document) => el.querySelector(s);
const brl = (c) => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const brl0 = (c) => brl(c).replace(',00', '');
const pts = (n) => n.toLocaleString('pt-BR');
const op = (id) => OPS.find((x) => x.id === id);
const prog = (x) => SITE[x.site];
const vmDe = (c, p) => c.vm[p] ?? PROG[p].vm;
const vmTxt = (v) => v.toLocaleString('pt-BR', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
const DIA = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'], MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const dCurta = (iso) => { const d = new Date(iso + 'T12:00'); return `${DIA[d.getDay()]} ${String(d.getDate()).padStart(2, '0')} ${MES[d.getMonth()]}`; };
const dLonga = (iso) => iso.split('-').reverse().join('/');
const detalhe = (x) => `${x.esc ? x.esc + ' escala' : 'direto'}${x.mala ? ' · mala' : ''}`;
const hora = (x) => `${x.sai} → ${x.chega.replace(' +1', '')}${x.chega.endsWith('+1') ? '<sup>+1</sup>' : ''}`;
function porPrograma(c) {
  const g = {}; c.escolha.map(op).forEach((x) => { g[prog(x)] = (g[prog(x)] || 0) + x.mi * PAX; });
  return Object.entries(g).map(([p, mi]) => ({ p, mi, vm: vmDe(c, p), reais: Math.round(mi * vmDe(c, p) * 100) }));
}
const custoOp = (c, x) => Math.round(x.mi * PAX * vmDe(c, prog(x)) * 100) + x.tx * PAX;
const preco = (c) => porPrograma(c).reduce((s, g) => s + g.reais, 0) + c.escolha.map(op).reduce((s, x) => s + x.tx * PAX, 0);
function mensagem() {
  const l = ['Oi, Ana! Seguem as opções pra Salvador:'];
  combos.forEach((c, i) => {
    l.push('', `*Opção ${i + 1} · ${c.nome}*`);
    c.escolha.map(op).forEach((x, j) => { const t = TRECHOS[x.t];
      if (j) l.push('');
      l.push(`${t.nome} ${dLonga(x.data)}`, `${t.cd} ${t.de} ${x.sai} → ${t.cp} ${t.para} ${x.chega.replace(' +1', '')}${x.chega.endsWith('+1') ? ' (chega no dia seguinte)' : ''}`, x.esc ? `${x.esc} escala` : 'Voo direto', `Mala despachada: ${x.mala ? '1 inclusa' : 'não inclusa'}`); });
    l.push('', `*${brl(venda(c))}* no Pix ou dinheiro${c.parc ? ` ou ${brl(c.parc)} em até ${c.vezes}x de ${brl(Math.round(c.parc / c.vezes))}` : ''}`);
  });
  l.push('', 'Os preços podem mudar até a emissão. Qual fica melhor pra você?');
  return l.join('\n');
}
const esc = (s) => s.replace(/[&<>]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[ch]);
const formatar = (t) => esc(t).replace(/\*([^*\n]+)\*/g, '<b>$1</b>');

// ---------- estado da tela ----------
let ver = new URLSearchParams(location.search).get('ver') || 'a';
let aberto = false, aba = 'proposta', troca = null, enviada = false, copiado = false;

// ---------- quadro ----------
function quadro() {

      ${l.map((o) => `<article class="cartao-ref ca" data-id="${o.id}" tabindex="0"><span class="canto"><button aria-label="Ações do orçamento #${o.id}"><i data-lucide="menu"></i></button></span>
        <div class="ca-quem"><span class="avc">${o.nome.split(' ').map((p) => p[0]).slice(0, 2).join('')}</span><span><b>${o.nome}</b><small>#${o.id}</small></span></div>

        <div class="trilho-t"><span>${o.tr.filter(Boolean).length} de ${o.tr.length} trechos com voo</span><span class="${o.etapa === 'pesquisado' ? 'pra-voce' : ''}">${o.quem}</span></div></article>`).join('')}</section>`; }).join('')}</div>`;
}

// ---------- proposta (o miolo é o mesmo nas três versões) ----------
// ---------- peças da combinação (as mesmas nos 3 jeitos de mostrar) ----------
// rotulo: no cartão diz "Ida · ..."; no comparativo e nas linhas o rótulo já está na coluna/linha
function trecho(c, ci, ti, rotulo) {
  const id = c.escolha[ti], x = op(id), t = TRECHOS[ti], k = `${ci}:${ti}`, on = troca === k;
  const outras = OPS.filter((y) => y.t === ti && y.id !== id).sort((a, b) => custoOp(c, a) - custoOp(c, b));
  return `<div class="trv ${on ? 'aberto' : ''}" data-tr="${k}"><button class="tr-l" data-troca="${k}" aria-expanded="${on}" aria-label="Trocar a ${t.nome.toLowerCase()} da opção ${ci + 1}">
      <small>${rotulo ? t.nome + ' · ' : ''}${dCurta(x.data)} · ${x.site}</small><b>${hora(x)}</b><small>${detalhe(x)} · ${pts(x.mi)} mi</small><span class="troca"><i data-lucide="arrow-left-right"></i></span></button>
    <div class="alts-w" ${on ? '' : 'inert'}><div><div class="alts"><span class="mini">Trocar por</span>${outras.map((y, i) => { const d = custoOp(c, y) - custoOp(c, x);
      return `<button class="alt" style="--i:${i}" data-escolher="${ci}:${ti}:${y.id}"><b>${dCurta(y.data)} · ${hora(y)}</b><span class="dif ${d < 0 ? 'menos' : ''}">${d < 0 ? '−' : '+'} ${brl0(Math.abs(d))}</span><small>${y.site} · ${detalhe(y)}</small></button>`; }).join('')}</div></div></div></div>`;
}
const milhas = (c, ci) => `<div class="mil">${porPrograma(c).map((g) => `<div class="ml"><span class="prog" data-p="${g.p}">${PROG[g.p].nome}</span><span class="q">${pts(g.mi)}<small>mi</small></span>
    <span class="stp"><button data-vm="${ci}:${g.p}:-1" aria-label="Diminuir valor da milha ${PROG[g.p].nome}"><i data-lucide="minus"></i></button><span class="${g.vm !== PROG[g.p].vm ? 'mudou' : ''}" title="valor da milha">R$ ${vmTxt(g.vm)}</span><button data-vm="${ci}:${g.p}:1" aria-label="Aumentar valor da milha ${PROG[g.p].nome}"><i data-lucide="plus"></i></button></span>
    <span class="eq num">${brl0(g.reais)}</span></div>`).join('')}</div>`;
// preço à vista: começa no calculado (milhas × valor da milha + taxas) e o dono digita o que vai cobrar por cima
const venda = (c) => c.livre ?? preco(c);
const reais = (v) => (v / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const ppHtml = (c) => { const pp = Math.round(venda(c) / PAX), d = pp - SKY; return `<b>${brl0(pp)} <small>por pessoa</small></b><span class="${d > 0 ? 'acima' : 'abaixo'}">${d > 0 ? '+' : '−'} ${brl0(Math.abs(d))} vs. Skyscanner</span>`; };
const calcHtml = (c, ci) => { if (c.livre == null) return 'calculado pelas milhas'; const d = c.livre - preco(c);
  return `${d > 0 ? '+' : '−'} ${brl0(Math.abs(d))} do calculado · <button class="link" data-volta-calc="${ci}" title="Voltar pro calculado (${brl0(preco(c))})">voltar pra ${brl0(preco(c))}</button>`; };
const precoB = (c, ci, rotulo = true) => `<div class="preco">${rotulo ? '<span class="rot">À vista, Pix ou dinheiro</span>' : ''}
    <label class="caixa v-in ${c.livre != null ? 'livre' : ''}"><span>R$</span><input data-venda="${ci}" inputmode="decimal" autocomplete="off" value="${reais(venda(c))}" aria-label="Preço à vista da opção ${ci + 1}"></label>
    <small class="calc" data-calc="${ci}">${calcHtml(c, ci)}</small><span class="pp" data-pp="${ci}">${ppHtml(c)}</span></div>`;
const parcB = (c, ci) => `<div class="parc"><label class="caixa"><span>R$</span><input data-parc="${ci}" inputmode="decimal" placeholder="parcelado" value="${c.parc ? (c.parc / 100).toLocaleString('pt-BR') : ''}" aria-label="Valor total parcelado da opção ${ci + 1}"></label>
    <select data-vezes="${ci}" aria-label="Vezes">${Array.from({ length: 11 }, (_, i) => i + 2).map((n) => `<option ${n === c.vezes ? 'selected' : ''} value="${n}">${n}x</option>`).join('')}</select>
    <small data-pinfo="${ci}">${parcInfo(c)}</small></div>`;
const cabCombo = (c, ci) => `<header><span class="nro">${ci + 1}</span><b>${c.nome}</b><button class="bt-mais" aria-label="Ações da combinação ${ci + 1}"><i data-lucide="ellipsis"></i></button></header>`;
const novaB = '<button class="nova" data-nova><i data-lucide="plus"></i>Outra combinação<small>até 3</small></button>';
const parcInfo = (c) => c.parc ? `${c.vezes}x de ${brl(Math.round(c.parc / c.vezes))} · + ${brl0(c.parc - venda(c))}` : 'Vazio = não oferece parcelado';

// 1: cartões do mesmo tamanho; cada parte (cabeçalho, ida, volta, milhas, preço, parcelado) fica na mesma altura em todos
const combos1 = () => `<div class="combos g1" style="--nl:${TRECHOS.length + 4}">${combos.map((c, ci) => `<article class="cb" data-c="${ci}">${cabCombo(c, ci)}${TRECHOS.map((_, ti) => trecho(c, ci, ti, true)).join('')}${milhas(c, ci)}${precoB(c, ci)}${parcB(c, ci)}</article>`).join('')}${combos.length < 3 ? novaB : ''}</div>`;
// 2: comparativo, os rótulos ficam uma vez só na coluna da esquerda
const ROT2 = () => ['', ...TRECHOS.map((t) => `<b>${t.nome}</b><small>${t.de} → ${t.para}</small>`), '<b>Milhas</b><small>e valor da milha</small>', '<b>À vista</b><small>Pix ou dinheiro</small>', '<b>Parcelado</b><small>no cartão</small>'];
const combos2 = () => `<div class="combos g2" style="--nl:${TRECHOS.length + 4}"><div class="rotulos">${ROT2().map((r) => `<span>${r}</span>`).join('')}</div>
  ${combos.map((c, ci) => `<article class="cb" data-c="${ci}">${cabCombo(c, ci)}${TRECHOS.map((_, ti) => trecho(c, ci, ti, false)).join('')}${milhas(c, ci)}${precoB(c, ci, false)}${parcB(c, ci)}</article>`).join('')}${combos.length < 3 ? novaB : ''}</div>`;
// 3: uma combinação por linha, colunas fixas (como uma tabela)
const combos3 = () => `<div class="combos g3"><div class="cab3"><span>Combinação</span>${TRECHOS.map((t) => `<span>${t.nome} <small>${t.de} → ${t.para}</small></span>`).join('')}<span>Milhas</span><span>Preço pro cliente</span></div>
  ${combos.map((c, ci) => `<article class="cb" data-c="${ci}">${cabCombo(c, ci)}${TRECHOS.map((_, ti) => trecho(c, ci, ti, false)).join('')}${milhas(c, ci)}<div class="pr3">${precoB(c, ci, false)}${parcB(c, ci)}</div></article>`).join('')}
  ${combos.length < 3 ? novaB : ''}</div>`;
let pv = new URLSearchParams(location.search).get('pv') || '2';
function ladoMsg() {
  const acoes = enviada
    ? `<div class="est"><b>Enviada agora.</b> Esperando a resposta da Ana.</div><div class="msg-acoes"><button class="bt pri"><i data-lucide="handshake"></i>Ela aceitou</button><button class="bt" data-copiar><i data-lucide="${copiado ? 'check' : 'copy'}"></i>${copiado ? 'Copiada' : 'Copiar de novo'}</button><button class="bt fant"><i data-lucide="circle-x"></i>Desistiu</button></div>`
    : `<div class="msg-acoes"><button class="bt" data-copiar><i data-lucide="${copiado ? 'check' : 'copy'}"></i>${copiado ? 'Copiada' : 'Copiar'}</button><a class="bt" href="#" onclick="return false"><i data-lucide="message-circle"></i>WhatsApp</a><button class="bt fant"><i data-lucide="pencil"></i>Editar texto</button><button class="bt pri" data-enviar><i data-lucide="send"></i>Marcar como enviada</button></div>`;
  return `<h3>Mensagem <small>vai só o preço, sem milhas</small></h3><div class="msg" data-msg>${formatar(mensagem())}</div>${acoes}`;
}
function miolo() {
  const menos = Math.min(...combos.map((c) => porPrograma(c).reduce((s, g) => s + g.mi, 0)));
  return `<div class="prop p${pv}"><div class="resumo"><span><b>${pts(menos)}</b> milhas na mais econômica</span><span><b>${OPS.length}</b> opções pesquisadas</span>
      <span class="skyp"><i data-lucide="search"></i>Skyscanner <b>${brl0(SKY)}</b> por pessoa</span><span class="salvo">Tudo salvo</span></div>
    ${{ 1: combos1, 2: combos2, 3: combos3 }[pv]()}
    <aside class="msg-l" data-lado>${ladoMsg()}</aside></div>`;
}
// ---------- fechamento (aba 3): qual ela aceitou, cliente, passageiros, recebimento ----------
const PESSOAS = [
  { id: 1, nome: 'Ana Luiza Prado', cpf: '123.456.789-09', obs: 'já é cliente' },
  { id: 2, nome: 'Marcos Prado', cpf: '987.654.321-00', junto: 4 },
  { id: 3, nome: 'Helena Prado', cpf: '456.789.123-45', junto: 2 },
  { id: 4, nome: 'Ana Paula Souza', cpf: '321.654.987-11' },
  { id: 5, nome: 'Bruno Lima', cpf: null },
  { id: 6, nome: 'Carla Menezes', cpf: '741.852.963-00' },
];
const F = { aceita: null, cliente: 1, pax: [1], forma: 'pix', parcelas: 10, recebido: 0, busca: '', fechado: false };
let fv = new URLSearchParams(location.search).get('fv') || '1', passoF = 0;
const pes = (id) => PESSOAS.find((p) => p.id === id);
const ini2 = (n) => n.split(' ').filter((x) => x.length > 2).slice(0, 2).map((x) => x[0]).join('');
const valorFinal = () => F.aceita == null ? 0 : (F.forma === 'parcelado' && combos[F.aceita].parc ? combos[F.aceita].parc : venda(combos[F.aceita]));
const situ = () => { const v = valorFinal(), r = F.recebido; return r >= v ? { nome: 'Pago', cls: 'ok' } : r > 0 ? { nome: 'Pago em parte', cls: 'warn' } : { nome: 'A receber', cls: 'warn' }; };
const pendF = () => [F.aceita == null && 'escolher a combinação', !F.cliente && 'o cliente', F.pax.length < PAX && `${PAX - F.pax.length} passageiro${PAX - F.pax.length > 1 ? 's' : ''}`].filter(Boolean);
const feitoF = (i) => [F.aceita != null, !!F.cliente, F.pax.length >= PAX, F.aceita != null && F.recebido >= valorFinal()][i];
const PASSOS_F = [['Qual ela aceitou?', ''], ['Cliente', 'quem está comprando'], ['Passageiros', 'os nomes que vão na passagem'], ['Recebimento', 'dá pra emitir antes ou depois de receber']];
const resumoPasso = (i) => [
  F.aceita == null ? 'nenhuma marcada' : `${combos[F.aceita].nome} · ${brl0(venda(combos[F.aceita]))}`,

  `${F.pax.length} de ${PAX}`,
  F.aceita == null ? '—' : `${situ().nome} · ${brl0(Math.max(0, valorFinal() - F.recebido))}`][i];
const numF = (i) => `<span class="f-n ${feitoF(i) ? 'ok' : ''}">${feitoF(i) ? '<i data-lucide="check"></i>' : i + 1}</span>`;
const cabF = (i, extra = '') => `<div class="f-cab">${numF(i)}<h3>${PASSOS_F[i][0]}</h3><small>${PASSOS_F[i][1]}</small>${extra}</div>`;

function secAceita() {
  return `<div class="f-aceita">${combos.map((c, ci) => { const on = F.aceita === ci;
    return `<button class="f-esc ${on ? 'on' : ''}" data-aceita="${ci}" aria-pressed="${on}" ${F.fechado ? 'disabled' : ''}><span class="f-esc-t"><span class="nro">${ci + 1}</span><b>${c.nome}</b><span class="f-marca">${on ? '<i data-lucide="check"></i>' : ''}</span></span>
      ${c.escolha.map(op).map((x) => `<span class="f-voo"><small>${TRECHOS[x.t].nome} · ${dCurta(x.data)} · ${x.site}</small><b>${hora(x)}</b></span>`).join('')}
      <span class="f-preco"><b>${brl(venda(c))}</b><small>${c.parc ? `ou ${brl0(c.parc)} em ${c.vezes}x` : 'à vista'}</small></span></button>`; }).join('')}</div>`;
}
const linhaP = (p, papel, tirar) => `<div class="f-p"><span class="avc">${ini2(p.nome)}</span><span class="f-p-t"><b>${p.nome}</b><small class="${p.cpf ? '' : 'alerta'}">${[papel, p.cpf || 'sem CPF no cadastro'].filter(Boolean).join(' · ')}</small></span>
  ${tirar && !F.fechado ? `<button class="btn-x" ${tirar} aria-label="Tirar ${p.nome}"><i data-lucide="x"></i></button>` : ''}</div>`;
// lista longa vira busca: o que se digita filtra as pessoas do cadastro
const resultados = (k) => { const q = F.busca.trim().toLowerCase(); if (!q) return '';
  const l = PESSOAS.filter((p) => !(k === 'pax' ? F.pax : []).includes(p.id) && `${p.nome} ${p.cpf || ''}`.toLowerCase().includes(q)).slice(0, 5);

  if (e.target.dataset.parc != null) { const n = +e.target.value.replace(/\./g, '').replace(',', '.'); c.parc = n > 0 ? Math.round(n * 100) : null; } else c.vezes = +e.target.value;
  $(`[data-pinfo="${ci}"]`).textContent = parcInfo(c); $('[data-msg]').innerHTML = formatar(mensagem()); copiado = false;
});

// ao sair do campo, o preço fica escrito certinho (1.400 → 1.400,00); vazio volta pro calculado
document.addEventListener('focusout', (e) => { const ci = e.target.dataset.venda; if (ci != null) e.target.value = reais(venda(combos[ci])); });
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.dataset.venda != null) { const l = [...document.querySelectorAll('[data-venda]')], n = l[l.indexOf(e.target) + 1]; n ? n.focus() : e.target.blur(); } });

desenhar();
// abre a proposta da Ana direto, pra ver logo (Esc volta pro quadro)
setTimeout(() => { $('#carregando').classList.add('fora'); abrir(); }, 900);
</script>
