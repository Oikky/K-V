<!doctype html>
<!-- RASCUNHO DESCARTÁVEL. Fechamento, rodada 9: a pessoa aceitou. O dono marca qual combinação, quem paga (vira cliente),
     quem voa (cadastro único pelo CPF: quem já voou é escolhido, quem é novo é cadastrado aqui) e o recebimento.
     Nada trava: dá pra fechar faltando passageiro e completar depois. Só o dono vê. Nada é salvo. -->
<html lang="pt-BR" data-theme="escuro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fechamento · Rascunho K&V</title>
<link rel="stylesheet" href="shared/base.css?r=12">
<style>
  .topo-orc { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-bottom: 8px; container-type: inline-size; }
  .topo-orc .quem { font-size: 14px; color: var(--text-2); font-weight: 600; white-space: nowrap; }
  .topo-orc h1 { font: 800 min(40px, calc(100cqi / (var(--n, 20) * 0.64)))/1.08 var(--font-brand); letter-spacing: -0.03em; white-space: nowrap; }
  .topo-orc h1 .seta { color: var(--text-3); font-weight: 600; }
  .secao .passo-n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 800 14px var(--font-brand); color: var(--text-2); flex: none; }
  .secao .passo-n.ok { background: var(--ok-bg); color: var(--ok); }
  .secao .passo-n svg.lucide { width: 15px; height: 15px; stroke-width: 2.6; }

  /* 1 · qual ela aceitou */
  .escolha { cursor: pointer; text-align: left; font: inherit; border: 0; display: flex; flex-direction: column; gap: 0; padding-bottom: 18px; }
  .escolha:not(.cheio):hover { background: var(--surface-2); }
  .escolha .grande { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; padding-right: 0; }
  .escolha .nro { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); font: 800 14px var(--font-brand); }
  .escolha.cheio .nro { background: rgb(0 0 0 / .14); }
  .escolha .marca { margin-left: auto; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
  .escolha.cheio .marca { border-color: var(--orange-ink); background: var(--orange-ink); color: var(--orange); }
  .escolha .marca svg.lucide { width: 15px; height: 15px; stroke-width: 3; }
  .escolha .preco { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
  .escolha.cheio .preco { border-color: rgb(0 0 0 / .14); }
  .escolha .preco b { font: 800 26px var(--font-brand); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .escolha .preco span { font-size: 13px; font-weight: 600; opacity: .72; white-space: nowrap; }

  /* 2 e 3 · pessoas */
  .pessoas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
  .vaga { display: flex; align-items: center; gap: 12px; min-height: 76px; padding: 14px 14px 14px 16px; border-radius: 20px; background: var(--surface-1); min-width: 0; }
  .vaga .ava { width: 40px; height: 40px; font-size: 13px; }
  .vaga .txt { display: grid; gap: 1px; min-width: 0; flex: 1; }
  .vaga .txt b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15.5px; }
  .vaga .txt span { font-size: 13px; color: var(--text-2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vaga .txt .alerta { color: var(--warn); }
  .vaga.vazia { border: 1.5px dashed var(--line); background: none; flex-wrap: wrap; }
  .vaga.vazia .n { font: 800 14px var(--font-brand); color: var(--text-3); width: 40px; text-align: center; flex: none; }
  .vaga.vazia .campo { flex: 1; min-width: 150px; }
  .sugestoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: -4px 0 14px; }
  .sugestoes .rot { font-size: 13px; color: var(--text-3); font-weight: 700; }
  .sugestoes .pilula .ava { width: 22px; height: 22px; font-size: 9.5px; margin-left: -8px; }

  /* 4 · recebimento */
  .receb { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px 24px; align-items: start; background: var(--surface-1); border-radius: 26px; padding: 22px; }
  .receb .rot { font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 8px; display: block; }
  .receb .caixa { display: flex; align-items: center; height: 52px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); padding: 0 14px; gap: 6px; }
  .receb .caixa:focus-within { border-color: var(--orange); }
  .receb .caixa span { font: 800 16px var(--font-brand); color: var(--text-3); }
  .receb .caixa input { flex: 1; min-width: 0; width: 0; height: 100%; border: 0; background: none; outline: none; font: 800 22px var(--font-brand); font-variant-numeric: tabular-nums; }
  .receb .rapidos { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .receb .situ { display: grid; gap: 6px; }
  .receb .situ b { font: 800 26px var(--font-brand); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .etiqueta.ok { background: var(--ok-bg); color: var(--ok); }
  .barra-acao .resumo .alerta { color: var(--warn); }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="shared/dados.js?r=7"></script>
<script src="shared/pessoas.js?r=1"></script>
<script src="shared/orcamentos.js?r=3"></script>
<script src="shared/proposta.js?r=3"></script>
<script src="shared/shell.js?r=10"></script>
<script src="shared/combo.js?r=3"></script>
<script src="shared/pessoa-form.js?r=1"></script>
<script>
const app = KVShell.montar('orcamentos');
const O = KV.orc, PS = KV.pessoas, { fmt } = KV;
const o = O.get(KVShell.param('id')) || O.lista().find((x) => x.etapa === 'enviado' && x.pessoaId && x.combos.length > 1) || O.lista().find((x) => x.etapa === 'enviado');
if (!o.combos) o.combos = O.sugerir(o, 2);
if (!o.aceita && o.combos.length === 1) o.aceita = o.combos[0].id;
if (o.clienteId === undefined) o.clienteId = o.pessoaId || null;
o.passageirosIds = o.passageirosIds || [];
o.receb = o.receb || { forma: 'pix', parcelas: 3, recebido: 0 };
const N = O.total(o);
const esc = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const lerNum = (t) => { const n = +String(t || '').replace(/[^\d,]/g, '').replace(',', '.'); return isFinite(n) ? n : 0; };
const numCampo = (n) => (n ? n.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) : '');
const hora = (x) => `${x.sai} → ${x.chega.replace(' +1', '')}${x.chega.includes('+1') ? '<sup>+1</sup>' : ''}`;
const internacional = () => o.trechos.some((t) => O.aeroporto(t.de).int || O.aeroporto(t.para).int);
const fechado = () => !['pesquisado', 'enviado'].includes(o.etapa);

// ---------- topo ----------
function topo() {
  const cidades = [o.trechos[0].de, ...o.trechos.map((t) => t.para)].map(O.cidadeCurta);
  return `<a class="voltar" href="orcamentos.html"><i data-lucide="arrow-left"></i>Orçamentos</a>${O.trilha(o, 'fechamento')}
    <div class="topo-orc"><span class="quem">${esc(o.contato.nome)} · ${o.contato.whatsapp} · #${o.numero}</span>
      <h1 style="--n:${cidades.join(' → ').length}">${cidades.join(' <span class="seta">→</span> ')}</h1></div>
    ${o.etapa === 'pesquisado' ? '<div class="aviso warn" style="margin-top:12px">A proposta ainda não foi marcada como enviada. Dá pra fechar mesmo assim.</div>' : ''}
    ${fechado() ? `<div class="aviso ok" style="margin-top:12px">Orçamento fechado. <a href="emissao.html?id=${o.id}" style="font-weight:700">Ir pra emissão →</a></div>` : ''}`;
}
const cabSecao = (n, titulo, feito, extra = '') => `<div class="secao"><span class="passo-n ${feito ? 'ok' : ''}">${feito ? '<i data-lucide="check"></i>' : n}</span><h2>${titulo}</h2>${extra}</div>`;

// ---------- 1 · qual ela aceitou ----------
function aceitou() {
  return cabSecao(1, 'Qual ela aceitou?', !!o.aceita) + `<div class="grade-ref" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))">${o.combos.map((c, i) => {
    const sel = o.aceita === c.id;
    return `<button class="cartao-ref escolha ${sel ? 'cheio' : ''}" data-aceita="${c.id}" aria-pressed="${sel}">
      <span class="grande"><span class="nro">${i + 1}</span>${esc(c.nome)}<span class="marca">${sel ? '<i data-lucide="check"></i>' : ''}</span></span>
      ${O.opsDaCombo(o, c).map((x) => `<span class="tr"><span><small>${O.nomeTrecho(o, x.trecho)} · ${O.diaSem(x.data)} ${fmt.dataCurta(x.data)} · <span class="sitio" data-s="${x.site}">${x.site}</span></small><b>${hora(x)}</b></span></span>`).join('')}
      <span class="preco"><b>${fmt.brl(c.venda)}</b><span>${c.parcelado ? `ou ${fmt.brl(c.parcelado)} em ${c.vezes}x` : 'à vista'}</span></span></button>`;
  }).join('')}</div>`;
}

// ---------- 2 e 3 · pessoas ----------
function linhaPessoa(p, { tirar, papel } = {}) {
  const avisos = [];
  if (internacional()) {
    if (!p.passaporte) avisos.push('sem passaporte no cadastro');
    else { const folga = Math.round((new Date(p.passaporte.validade + 'T12:00') - new Date(o.trechos[0].data + 'T12:00')) / 864e5); if (folga < 180) avisos.push(folga < 0 ? 'passaporte vence antes do voo' : 'passaporte vence menos de 6 meses depois'); }
  }
  return `<div class="vaga"><span class="ava">${fmt.iniciais(p.nome)}</span><span class="txt"><b>${esc(p.nome)}</b>
    <span class="${avisos.length ? 'alerta' : ''}">${avisos.length ? avisos.join(' · ') : [papel, p.cpf].filter(Boolean).join(' · ')}</span></span>
    ${fechado() ? '' : `<button class="btn icone fantasma" ${tirar} aria-label="Tirar ${esc(p.nome)}"><i data-lucide="x"></i></button>`}</div>`;
}
const opcoesPessoas = (excluir = []) => `<option value="">Buscar por nome ou CPF</option>${PS.lista().filter((p) => !excluir.includes(p.id)).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).map((p) => `<option value="${p.id}">${esc(p.nome)} · ${p.cpf}</option>`).join('')}`;
function quemPaga() {
  const c = o.clienteId && PS.pessoa(o.clienteId);
  const corpo = c ? `<div class="pessoas">${linhaPessoa(c, { tirar: 'data-tira-cliente', papel: PS.ehCliente(c.id) ? `cliente · ${PS.viagensDe(c.id).length} viagens` : 'cliente novo' })}</div>`
    : `<div class="pessoas"><div class="vaga vazia"><span class="n"><i data-lucide="user-round"></i></span><div class="campo"><label for="cli" class="escondido" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Quem paga</label><select id="cli" data-cliente data-combo="sim">${opcoesPessoas()}</select></div>
        <button class="btn" data-nova-pessoa="cliente"><i data-lucide="user-plus"></i>Cadastrar ${esc(o.contato.nome.split(' ')[0])}</button></div></div>`;
  return cabSecao(2, 'Quem paga', !!c, '<span class="n">vira cliente</span>') + corpo;
}
function quemVoa() {
  const ids = o.passageirosIds, lista = ids.map(PS.pessoa).filter(Boolean);
  const sug = fechado() || ids.length >= N ? [] : [o.clienteId, ...(o.clienteId ? PS.viajaCom(o.clienteId).map((v) => v.pessoa.id) : [])].filter((id, i, a) => id && a.indexOf(id) === i && !ids.includes(id)).slice(0, 5);
  const vazias = fechado() ? 0 : N - lista.length;
  return cabSecao(3, 'Quem voa', lista.length >= N, `<span class="n">${lista.length} de ${N} · ${O.fmtPax(o.passageiros)}</span>`)
    + (sug.length ? `<div class="sugestoes"><span class="rot">Costumam ir:</span>${sug.map((id) => { const p = PS.pessoa(id); return `<button class="pilula" data-add="${id}"><i data-lucide="plus" style="width:15px;height:15px"></i>${esc(p.nome.split(' ').slice(0, 2).join(' '))}${id === o.clienteId ? ' <span class="cont">quem paga</span>' : ''}</button>`; }).join('')}${sug.length > 1 && sug.length <= N - ids.length ? '<button class="pilula" data-add-todos>Todos</button>' : ''}</div>` : '')
    + `<div class="pessoas">${lista.map((p) => linhaPessoa(p, { tirar: `data-tira="${p.id}"`, papel: p.id === o.clienteId ? 'quem paga' : '' })).join('')}
      ${Array.from({ length: Math.max(0, vazias) }, (_, i) => `<div class="vaga vazia"><span class="n">${lista.length + i + 1}</span><div class="campo"><select data-pax aria-label="Passageiro ${lista.length + i + 1}" data-combo="sim">${opcoesPessoas(ids)}</select></div>
        <button class="btn icone" data-nova-pessoa="pax" aria-label="Cadastrar pessoa nova" title="Pessoa nova"><i data-lucide="user-plus"></i></button></div>`).join('')}</div>`;
}

// ---------- 4 · recebimento ----------
function recebimento() {
  const c = O.aceita(o), s = O.situacao(o), r = o.receb;
  return cabSecao(4, 'Recebimento', !!s && s.id === 'pago', '<span class="n">dá pra emitir antes ou depois de receber</span>') + `<div class="receb">
    <div><span class="rot">Forma</span><div class="seg">${O.formas.map((f) => `<button data-forma="${f.id}" aria-pressed="${r.forma === f.id}" ${fechado() ? 'disabled' : ''}>${f.nome}</button>`).join('')}</div>
      ${r.forma === 'parcelado' ? `<div class="campo" style="margin-top:12px;max-width:180px"><label for="parc">Parcelas</label><select id="parc" data-parcelas data-combo="nao" ${fechado() ? 'disabled' : ''}>${Array.from({ length: 11 }, (_, i) => i + 2).map((n) => `<option ${n === r.parcelas ? 'selected' : ''}>${n}</option>`).join('')}</select></div>` : ''}</div>
    <div><label class="rot" for="rec">Já recebeu</label><div class="caixa"><span>R$</span><input id="rec" data-recebido inputmode="decimal" placeholder="0" autocomplete="off" value="${numCampo(r.recebido)}" ${fechado() ? 'readonly' : ''}></div>
      ${fechado() ? '' : `<div class="rapidos"><button class="btn pequeno" data-rec="0">Nada ainda</button>${c ? `<button class="btn pequeno" data-rec="${O.valorFinal(o) / 2}">Metade</button><button class="btn pequeno" data-rec="${O.valorFinal(o)}">Tudo</button>` : ''}</div>`}</div>
    <div class="situ" data-situ>${situHtml()}</div></div>`;
}
function situHtml() {
  const s = O.situacao(o);
  if (!s) return '<span class="rot">Situação</span><span class="faint">Escolha a combinação aceita.</span>';
  return `<span class="rot">Situação</span><span><span class="etiqueta ${s.cls}">${s.nome}</span></span>${s.falta ? `<b>${fmt.brl(s.falta)}</b><span class="faint" style="font-size:13px;font-weight:600">falta receber${o.receb.forma === 'parcelado' ? ` · ${o.receb.parcelas}x de ${fmt.brl(O.valorFinal(o) / o.receb.parcelas)}` : ''}</span>` : ''}`;
}

// ---------- barra de baixo ----------
function barra() {
  if (fechado()) return '';
  const c = O.aceita(o), falta = N - o.passageirosIds.length;
  const pend = [!c && 'escolher a combinação', !o.clienteId && 'quem paga', falta > 0 && `${falta} passageiro${falta > 1 ? 's' : ''}`].filter(Boolean);
  return `<div class="barra-acao"><span class="resumo"><b>${c ? `${esc(c.nome)} · ${fmt.brl(O.valorFinal(o))}${o.receb.forma === 'parcelado' && c.parcelado ? ' parcelado' : ''}` : 'Nenhuma combinação marcada'}</b>
    <span class="${pend.length ? 'alerta' : ''}">${pend.length ? `Falta: ${pend.join(', ')}. Dá pra completar depois.` : 'Tudo pronto pra emitir.'}</span></span>
    <button class="btn primario" data-fechar ${c ? '' : 'disabled style="opacity:.5"'}><i data-lucide="handshake"></i>Fechar orçamento</button></div>`;
}

function render() {
  const y = scrollY;
  app.innerHTML = topo() + aceitou() + quemPaga() + quemVoa() + recebimento() + barra();
  document.title = `Fechamento #${o.numero} ${O.destino(o)} · Rascunho K&V`;
  KVShell.icones();
  scrollTo(0, y);
}

// ---------- janela: pessoa nova (o mesmo formulário da ficha, com nome e WhatsApp do contato quando é quem paga) ----------
const dlg = document.createElement('dialog'); dlg.className = 'janela'; document.body.append(dlg);
const fechar = () => KVShell.desfazer({ janela: 1 }, sinc);
dlg.addEventListener('cancel', (e) => { e.preventDefault(); fechar(); });
dlg.addEventListener('click', (e) => { if (e.target === dlg) fechar(); });
function sinc() {
  const j = KVShell.param('janela');
  if (j === 'cliente' || j === 'pax') {
    KVPessoaForm.abrir(dlg, null, { fechar, aoSalvar: (p) => {
      if (j === 'cliente') { o.clienteId = p.id; if (!o.passageirosIds.includes(p.id) && o.passageirosIds.length < N) o.passageirosIds.push(p.id); }
      else if (o.passageirosIds.length < N) o.passageirosIds.push(p.id);
      fechar(); render();
    } });
    dlg.querySelector('.sub').textContent = j === 'cliente' ? 'Quem paga a viagem. Fica no cadastro único, achado pelo CPF.' : 'Quem vai voar. Fica no cadastro único, achado pelo CPF.';
    if (j === 'cliente') { dlg.querySelector('#f-nome').value = o.contato.nome; dlg.querySelector('#f-zap').value = o.contato.whatsapp; dlg.querySelector('#f-cpf').focus(); }
  } else if (dlg.open) dlg.close();
}

// ---------- ações ----------
const addPax = (id) => { if (id && !o.passageirosIds.includes(id) && o.passageirosIds.length < N) o.passageirosIds.push(id); };
app.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.aceita) { o.aceita = b.dataset.aceita; render(); }
  else if (b.hasAttribute('data-tira-cliente')) { o.clienteId = null; render(); }
  else if (b.dataset.tira) { o.passageirosIds = o.passageirosIds.filter((x) => x !== b.dataset.tira); render(); }
  else if (b.dataset.add) { addPax(b.dataset.add); render(); }
  else if (b.hasAttribute('data-add-todos')) { app.querySelectorAll('[data-add]').forEach((x) => addPax(x.dataset.add)); render(); }
  else if (b.dataset.novaPessoa) { KVShell.irPara({ janela: b.dataset.novaPessoa }); sinc(); }
  else if (b.dataset.forma) { o.receb.forma = b.dataset.forma; if (b.dataset.forma === 'parcelado' && O.aceita(o)) o.receb.parcelas = O.aceita(o).vezes; render(); }
  else if (b.dataset.rec != null) { o.receb.recebido = +b.dataset.rec; render(); }
  else if (b.hasAttribute('data-fechar')) { O.fechar(o); location = `emissao.html?id=${o.id}&fechou=1`; }
});
app.addEventListener('change', (e) => {
  if (e.target.matches('[data-cliente]') && e.target.value) { o.clienteId = e.target.value; if (!o.passageirosIds.length) addPax(e.target.value); render(); }
  if (e.target.matches('[data-pax]') && e.target.value) { addPax(e.target.value); render(); }
  if (e.target.matches('[data-parcelas]')) { o.receb.parcelas = +e.target.value; app.querySelector('[data-situ]').innerHTML = situHtml(); }
});
app.addEventListener('input', (e) => {
  if (e.target.matches('[data-recebido]')) { o.receb.recebido = lerNum(e.target.value); app.querySelector('[data-situ]').innerHTML = situHtml(); }
});
app.addEventListener('focusout', (e) => { if (e.target.matches('[data-recebido]')) render(); });

render();
sinc();
KVShell.aoVoltar(() => { render(); sinc(); });
</script>
</body>
</html>
