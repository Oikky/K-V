<!doctype html>
<!-- RASCUNHO DESCARTÁVEL, rodada 2. Escolhido na rodada 1: "Por titular" como vista principal,
     "Tabela por conta" como secundária. Sem valor em R$ (o dono não precisa). As variações da rodada 1
     estão na branch rascunhos/rodada-1. -->
<html lang="pt-BR" data-theme="escuro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contas · Rascunho K&V</title>
<link rel="stylesheet" href="shared/base.css?r=5">
<style>
  .filtros { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .seg { display: inline-flex; padding: 4px; border-radius: var(--r-pill); background: var(--surface-1); border: 1px solid var(--line); }
  .seg button { height: 34px; padding: 0 14px; border-radius: var(--r-pill); border: 0; background: none; cursor: pointer; font-weight: 700; color: var(--text-2); display: inline-flex; gap: 6px; align-items: center; }
  .seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }
  .ordem { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-2); }
  .ordem select { height: 42px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--surface-1); padding: 0 14px; font-weight: 600; color: var(--text); }

  .grade-tit { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .tit { background: var(--surface-1); border-radius: var(--r-card); padding: 18px 18px 8px; }
  .tit header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .av { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
  .tit header .tot { margin-left: auto; text-align: right; font-size: 13px; color: var(--text-2); }
  .tit header .tot b { display: block; font: 800 17px var(--font-brand); color: var(--text); }
  .linha-conta { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); text-decoration: none; }
  .linha-conta:hover { color: var(--orange); }
  .linha-conta .s { text-align: right; font-weight: 700; }
  .linha-conta .det { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--text-2); }
  .linha-conta .det .barra { flex: 1; max-width: 120px; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="shared/dados.js?r=5"></script>
<script src="shared/shell.js?r=5"></script>
<script>
const app = KVShell.montar('contas');
const { fmt } = KV;
const contas = KV.contas();
const P = (id) => KV.programa(id);
const params = new URLSearchParams(location.search);
const estado = { busca: '' };
function lerUrl() {
  estado.vista = KVShell.param('vista') || 'titular';
  estado.ordem = KVShell.param('ordem') || 'pontos';
  estado.prog = KVShell.param('prog') || 'todos';
  estado.soAlerta = KVShell.param('aviso') === '1';
}

function vagas(c, comBarra = true) {
  const b = KV.beneficiarios(c);
  if (!b) return '<span class="faint">só transfere</span>';
  const cls = b.livres === 0 ? 'danger' : b.livres <= 2 ? 'warn' : '';
  return `<span class="num" style="${cls ? `color:var(--${cls})` : 'color:var(--text-2)'}">${b.usados}/${b.limite}</span>${comBarra ? `<div class="barra ${cls}"><i style="width:${b.usados / b.limite * 100}%"></i></div>` : ''}`;
}
function venc(c) {
  const v = KV.vencendo(c);
  return v.pontos ? `<span class="chip warn"><i data-lucide="hourglass"></i>${fmt.pts(v.pontos)} em ${KV.diasAte(v.primeiro)}d</span>` : '';
}

function desenhar() {
  const titulares = KV.titulares.map((t) => {
    const cs = contas.filter((c) => c.titular === t);
    return { nome: t, contas: cs, pontos: cs.reduce((s, c) => s + c.saldo, 0) };
  });
  const comAviso = new Set(KV.alertas().map((a) => a.conta));
  app.innerHTML = `<div class="topo"><div><h1>Contas de pontos</h1><div class="muted">${titulares.length} titulares · ${contas.length} contas</div></div>
      <div class="acoes"><a class="btn" href="entrada.html"><i data-lucide="plus"></i>Registrar entrada</a>
      <button class="btn primario"><i data-lucide="wallet"></i>Nova conta</button></div></div>
    <div class="filtros">
      <div class="seg" role="group" aria-label="Como ver">
        <button data-vista="titular" aria-pressed="${estado.vista === 'titular'}"><i data-lucide="users"></i>Por titular</button>
        <button data-vista="tabela" aria-pressed="${estado.vista === 'tabela'}"><i data-lucide="table"></i>Tabela</button></div>
      ${estado.vista === 'titular' ? `<label class="ordem">Ordenar por <select id="ordem">
        <option value="pontos" ${estado.ordem === 'pontos' ? 'selected' : ''}>Mais pontos primeiro</option>
        <option value="programas" ${estado.ordem === 'programas' ? 'selected' : ''}>Mais programas primeiro</option></select></label>`
      : `<div class="pilulas" role="group" aria-label="Programa">${[{ id: 'todos', nome: 'Todos' }, ...KV.programas].map((p) => `<button class="pilula" data-prog="${p.id}" aria-pressed="${estado.prog === p.id}">${p.nome}
          <span class="cont">${p.id === 'todos' ? contas.length : contas.filter((c) => c.programaId === p.id).length}</span></button>`).join('')}
        <button class="pilula" data-alerta aria-pressed="${estado.soAlerta}"><i data-lucide="triangle-alert"></i>Com aviso <span class="cont">${comAviso.size}</span></button></div>`}
      <div class="busca-wrap"><i data-lucide="search"></i><input class="busca" placeholder="Buscar titular" value="${estado.busca}"></div>
    </div><div id="lista"></div>`;

  const busca = (t) => !estado.busca || t.toLowerCase().includes(estado.busca.toLowerCase());
  const lista = app.querySelector('#lista');
  if (estado.vista === 'titular') {
    const ordenados = titulares.filter((t) => busca(t.nome)).sort((a, b) => estado.ordem === 'programas'
      ? (b.contas.length - a.contas.length) || (b.pontos - a.pontos)
      : b.pontos - a.pontos);
    lista.innerHTML = `<div class="grade-tit">${ordenados.map((t) => `<section class="tit">
      <header><div class="av">${fmt.iniciais(t.nome)}</div><div><h3>${t.nome}</h3><div class="faint" style="font-size:13px">${t.contas.length} programa${t.contas.length > 1 ? 's' : ''}</div></div>
        <div class="tot">no total<b class="num">${fmt.pts(t.pontos)}</b></div></header>
      ${t.contas.sort((a, b) => b.saldo - a.saldo).map((c) => `<a class="linha-conta" href="conta.html?id=${c.id}"><span class="prog" data-p="${c.programaId}">${P(c.programaId).nome}</span>
        <span class="s num">${fmt.pts(c.saldo)} pts</span>
        <span class="det">${KV.beneficiarios(c) ? 'Vagas ' + vagas(c) : vagas(c)} ${venc(c)}</span></a>`).join('')}
    </section>`).join('') || '<p class="muted">Nenhum titular com esse nome.</p>'}</div>`;
  } else {
    const linhas = contas.filter((c) => (estado.prog === 'todos' || c.programaId === estado.prog) && busca(c.titular) && (!estado.soAlerta || comAviso.has(c))).sort((a, b) => b.saldo - a.saldo);
    lista.innerHTML = `<div class="tabela-wrap"><table>
      <thead><tr><th>Titular</th><th>Programa</th><th class="dir">Saldo</th><th>Vence em 60 dias</th><th>Beneficiários</th><th>Clube</th></tr></thead>
      <tbody>${linhas.map((c) => `<tr class="clicavel" onclick="location='conta.html?id=${c.id}'">
        <td><b>${c.titular}</b></td><td><span class="prog" data-p="${c.programaId}">${P(c.programaId).nome}</span></td>
        <td class="dir num"><b>${fmt.pts(c.saldo)}</b></td><td>${venc(c) || '<span class="faint">—</span>'}</td>
        <td><div style="display:flex;gap:10px;align-items:center">${vagas(c)}</div></td>
        <td class="muted num">${c.clube ? fmt.pts(c.clube) + '/mês' : '—'}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Nenhuma conta com esse filtro.</td></tr>'}</tbody></table></div>`;
  }

  // cada troca vira um passo: o voltar do celular/mouse desfaz a última
  const passo = (mud) => { KVShell.irPara(mud); lerUrl(); desenhar(); };
  app.querySelectorAll('[data-vista]').forEach((b) => b.onclick = () => { if (b.dataset.vista !== estado.vista) passo({ vista: b.dataset.vista }); });
  const ord = app.querySelector('#ordem'); if (ord) ord.onchange = () => passo({ ordem: ord.value });
  app.querySelectorAll('[data-prog]').forEach((b) => b.onclick = () => { if (b.dataset.prog !== estado.prog) passo({ prog: b.dataset.prog === 'todos' ? null : b.dataset.prog }); });
  const al = app.querySelector('[data-alerta]'); if (al) al.onclick = () => passo({ aviso: estado.soAlerta ? null : '1' });
  const bu = app.querySelector('.busca'); bu.oninput = (e) => { estado.busca = e.target.value; const pos = e.target.selectionStart; desenhar(); const n = app.querySelector('.busca'); n.focus(); n.setSelectionRange(pos, pos); };
  KVShell.icones();
}
lerUrl();
desenhar();
KVShell.aoVoltar(() => { lerUrl(); desenhar(); });
</script>
</body>
</html>
