<!doctype html>
<!-- RASCUNHO DESCARTÁVEL. Orçamento, rodada 8b (refeito no jeito da referência HubSpot):
     topo com a rota grande e poucos números; opções de voo em cartões (a de menor custo em laranja cheio, pro dono);
     filtros em pílula (trecho e dia); "Nova opção" abre um painel lateral que fica aberto pra lançar várias seguidas.
     A lista de conferência abre numa janela. ?papel=pesquisador esconde custo em R$. Nada é salvo. -->
<html lang="pt-BR" data-theme="escuro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orçamento · Rascunho K&V</title>
<link rel="stylesheet" href="shared/base.css?r=11">
<style>

  /* título e números sempre numa linha */
  .topo-orc { container-type: inline-size; }
  .topo-orc h1[style] { white-space: nowrap; max-width: none; font-size: min(40px, calc(100cqi / (var(--n, 20) * 0.64))); }
  .topo-orc .quem, .topo-orc .quem a { white-space: nowrap; }
  /* filtros A: abas grandes + mini calendário */
  .fa-abas { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin: -4px 0 14px; }
  .fa-abas button { flex: none; display: grid; gap: 2px; text-align: left; padding: 8px 18px 12px 2px; margin-right: 18px; border: 0; background: none; cursor: pointer; color: var(--text-2); border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .fa-abas button small { font-size: 12px; color: var(--text-3); font-weight: 600; white-space: nowrap; }
  .fa-abas button b { font: 800 20px var(--font-brand); letter-spacing: -0.01em; white-space: nowrap; }
  .fa-abas button span { font-size: 12.5px; color: var(--text-3); white-space: nowrap; }
  .fa-abas button[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--orange); }
  .fa-dias { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 16px; }
  .dia-c { flex: none; display: grid; justify-items: center; gap: 1px; min-width: 56px; padding: 8px 10px; border-radius: 16px; border: 1px solid var(--line); background: transparent; cursor: pointer; color: var(--text-2); position: relative; }
  .dia-c small { font-size: 12px; font-weight: 600; }
  .dia-c b { font: 800 18px var(--font-brand); color: var(--text); }
  .dia-c i { font-style: normal; font-size: 11.5px; color: var(--text-3); font-weight: 700; }
  .dia-c.todos { min-width: 64px; align-content: center; font-weight: 700; }
  .dia-c.pedido::after { content: 'pedido'; position: absolute; top: -8px; left: 50%; translate: -50% 0; font-size: 10.5px; font-weight: 800; padding: 1px 6px; border-radius: 6px; background: var(--surface-3); color: var(--text-2); }
  .dia-c[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
  .dia-c[aria-pressed="true"] b, .dia-c[aria-pressed="true"] i { color: var(--bg); }
  .fa-dias { padding-top: 8px; }
  .escondido { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .topo-orc { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-bottom: 8px; }
  .topo-orc .quem { font-size: 14px; color: var(--text-2); font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .topo-orc h1 { font: 800 40px/1.08 var(--font-brand); letter-spacing: -0.03em; max-width: 22ch; }
  .topo-orc h1 .seta { color: var(--text-3); font-weight: 600; }
  .linha-acoes { display: flex; gap: 10px 12px; align-items: center; flex-wrap: wrap; }
  .linha-acoes .acoes { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  .pedido-pilula { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: var(--r-pill); background: var(--teal-bg); font-size: 14px; font-weight: 600; }
  .pedido-pilula svg.lucide { width: 16px; height: 16px; color: var(--teal-soft); }
  .sel-pilula.solta { margin-left: 0; }
  .sel-pilula.solta select { height: 42px; background: var(--surface-1); }
  .filtro-linha { display: flex; gap: 8px 8px; flex-wrap: wrap; align-items: center; margin: -4px 0 12px; }
  .filtro-linha .rot { font-size: 13px; color: var(--text-3); font-weight: 700; min-width: 48px; }
  /* horário sempre numa linha só: a letra encolhe com a largura do cartão em vez de quebrar */
  .grade-ref .op { container-type: inline-size; }
  .op .hora { font: 800 clamp(17px, 9.2cqi, 26px)/1.1 var(--font-brand); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; padding-right: 40px; }
  .op .hora small { font: 600 14px var(--font); opacity: .7; margin-left: 2px; }
  /* o cartão da opção vai até o fim da linha e o valor fica grudado embaixo: todos com o mesmo formato */
  .grade-ref .op { display: flex; flex-direction: column; gap: 12px; }
  .op .tags-op { margin-top: auto; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; cursor: grab; }
  .op .tags-op::-webkit-scrollbar { display: none; }
  .op .tags-op.nao-cabe { mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); }
  .op .tags-op .etiqueta { flex: none; }
  .op .pe-op { display: flex; align-items: flex-end; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  .op.cheio .pe-op { border-color: rgb(0 0 0 / .14); }
  .op .valor { display: grid; gap: 3px; min-width: 0; }
  .op .valor b { white-space: nowrap; font: 800 22px var(--font-brand); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .op .valor b small { font: 700 13px var(--font); opacity: .7; }
  .op .valor span { font-size: 13px; color: var(--text-2); white-space: nowrap; }
  .op .valor .custo { font-size: 12px; color: var(--text-3); }
  .op.cheio .valor span { color: var(--orange-ink); opacity: .72; }
  .op .site { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; }
  .op .site::before { content: ''; width: 9px; height: 9px; border-radius: 3px; background: var(--c, var(--text-3)); }
  .op.cheio .site::before { background: var(--orange-ink); }
  .site[data-s="Smiles"] { --c: #F08A24; } .site[data-s="Latam"] { --c: #D1365B; } .site[data-s="TudoAzul"] { --c: #2F7FE0; } .site[data-s="Interline"] { --c: #69A7F0; } .site[data-s="Skyscanner"] { --c: #3CCB8B; }
  .op.nova { animation: kv-acende 1.4s ease-out; }
  @keyframes kv-acende { from { box-shadow: 0 0 0 2px var(--orange); } }
  @media (prefers-reduced-motion: reduce) { .op.nova { animation: none; } }
  .vazio { color: var(--text-3); padding: 18px 2px; font-size: 14px; }
  .conf-lista { display: grid; gap: 2px; }
  .conf-lista label { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-radius: 12px; cursor: pointer; font-size: 15px; }
  .conf-lista label:hover { background: var(--surface-2); }
  .conf-lista input { width: 20px; height: 20px; accent-color: var(--ok); flex: none; }
  .conf-lista label.feito span { color: var(--text-3); text-decoration: line-through; }
  .form-op { display: grid; gap: 12px; padding-bottom: 12px; }
  .form-op .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-op .lanc { font-size: 13px; color: var(--text-3); }
  .form-op .erro { border-color: var(--danger) !important; }
  .salvas { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ok); font-weight: 700; min-height: 20px; }
  kbd { font: 700 11.5px ui-monospace, Consolas, monospace; padding: 2px 6px; border-radius: 6px; background: rgb(0 0 0 / .15); }
  @media (max-width: 760px) {
    .linha-acoes .acoes { margin-left: 0; width: 100%; }
    .filtro-linha { flex-wrap: nowrap; overflow-x: auto; margin-left: -16px; margin-right: -16px; padding: 0 16px 4px; scrollbar-width: none; }
    .filtro-linha .pilula, .filtro-linha .rot { flex: none; }
  }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="shared/dados.js?r=7"></script>
<script src="shared/pessoas.js?r=1"></script>
<script src="shared/orcamentos.js?r=1"></script>
<script src="shared/proposta.js?r=3"></script>
<script src="shared/shell.js?r=10"></script>
<script>
const papel = KVShell.param('papel') === 'pesquisador' ? 'pesquisador' : 'dono';
const dono = papel === 'dono';
const eu = KVShell.param('p') || 'p1';
const app = KVShell.montar('orcamentos', { papel });
const O = KV.orc, { fmt } = KV;
const o = O.get(KVShell.param('id')) || O.lista().find((x) => x.etapa === (dono ? 'pesquisado' : 'pesquisa') && (dono || x.responsavel === eu));
if (KVShell.param('pegou') && o.etapa === 'novo') O.pegar(o, KVShell.param('pegou'));
const quem = dono ? 'Dono' : O.pesquisadores[eu];
let ultimaNova = null, salvasAgora = 0, rascunho = null;

const diaCurto = (iso) => ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'][new Date(iso + 'T12:00').getDay()];
const trechoSel = () => Math.min(o.trechos.length - 1, +(KVShell.param('t') || 0));
const opsDo = (ti) => o.opcoes.filter((x) => x.trecho === ti);
const eDinheiro = (s) => O.site(s).forma === 'dinheiro';
const pessoas = o.passageiros.adultos + o.passageiros.criancas + o.passageiros.bebes;
const podeLancar = () => dono || (o.responsavel === eu && o.etapa === 'pesquisa');
function foraDoPedido(op) {
  const p = o.pedido || '', l = [];
  if (p.includes('Só voo direto') && op.escalas > 0) l.push('não é direto');
  if (p.includes('Até 1 escala') && op.escalas > 1) l.push('mais de 1 escala');
  if (p.includes('Com bagagem') && !op.bagagem) l.push('sem mala');
  if (p.includes('Só pontos') && eDinheiro(op.site)) l.push('em dinheiro');
  if (p.includes('Saída de manhã') && +op.sai.slice(0, 2) >= 12) l.push('sai à tarde');
  return l;
}

// ---------- topo: a rota grande e poucas coisas ----------
function topo() {
  const cidades = [o.trechos[0].de, ...o.trechos.map((t) => t.para)].map(O.cidadeCurta);
  const feitos = o.conferencia.filter((c) => c.feito).length;
  let acoes = '';
  if (dono) acoes = `<label class="sel-pilula solta"><span class="escondido">Pesquisador</span><select id="passar" data-combo="nao">${[['', 'Na fila'], ['p1', 'Ana pesquisa'], ['p2', 'Lucas pesquisa']].map(([v, t]) => `<option value="${v}" ${(o.responsavel || '') === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label class="sel-pilula solta"><span class="escondido">Etapa</span><select id="etapa" data-combo="nao">${O.etapas.map((e) => `<option value="${e.id}" ${e.id === o.etapa ? 'selected' : ''}>${e.nome}</option>`).join('')}</select></label>
      <a class="btn redondo" href="#" title="Abriria a conversa no WhatsApp" aria-label="WhatsApp"><i data-lucide="message-circle"></i></a>
      ${['pesquisado', 'enviado'].includes(o.etapa) ? `<a class="btn primario" href="proposta.html?id=${o.id}"><i data-lucide="send"></i>${o.etapa === 'pesquisado' ? 'Montar proposta' : 'Proposta'}</a>` : ''}`;
  else if (o.etapa === 'novo') acoes = '<button class="btn primario" data-pegar><i data-lucide="hand"></i>Pegar</button>';
  else if (o.etapa === 'pesquisa' && o.responsavel === eu) acoes = '<button class="btn primario" data-pesquisado><i data-lucide="check-check"></i>Marcar como pesquisado</button>';
  else acoes = `<span class="etiqueta">${O.etapa(o.etapa).nome}</span>`;
  return `<a class="voltar" href="orcamentos.html${dono ? '' : '?papel=pesquisador'}"><i data-lucide="arrow-left"></i>Orçamentos</a>${dono ? O.trilha(o, 'pesquisa') : ''}
    <div class="topo-orc"><span class="quem">${dono ? o.contato.nome : o.contato.nome.split(' ')[0]} · #${o.numero}${dono && o.pessoaId ? ` · <a href="pessoa.html?id=${o.pessoaId}" style="color:var(--orange)">é cliente</a>` : ''}</span>
      <h1 style="--n:${cidades.join(' → ').length}">${cidades.join(' <span class="seta">→</span> ')}</h1>
      <div class="kpis"><span class="kpi"><b>${fmt.dataCurta(o.trechos[0].data)}</b><span>${o.trechos.length > 1 ? `a ${fmt.dataCurta(o.trechos[o.trechos.length - 1].data)}` : 'só ida'}</span></span>
        <span class="kpi"><b>${pessoas}</b><span>${pessoas > 1 ? 'pessoas' : 'pessoa'}</span></span><span class="kpi ${dono && o.etapa === 'pesquisado' ? 'destaque' : ''}"><b>${o.opcoes.length}</b><span>opções</span></span></div>
      <div class="linha-acoes">${o.pedido ? `<span class="pedido-pilula"><i data-lucide="message-square-quote"></i>${o.pedido}</span>` : ''}
        <button class="btn" data-conf><i data-lucide="list-checks"></i>Conferência ${feitos}/${o.conferencia.length}</button>
        <span class="acoes">${acoes}</span></div></div>`;
}

// ---------- opções: filtro por trecho e por dia, cartões ----------
// filtros de trecho e dia (escolhida a A): trechos em abas grandes e dias como mini calendário
function filtros() {
  const ti = trechoSel(), dia = KVShell.param('dia');
  const dias = [...new Set(opsDo(ti).map((x) => x.data))].sort();
  const nDia = (d) => opsDo(ti).filter((x) => x.data === d).length;
  const cab = `<div class="secao"><h2>Opções de voo</h2><span class="n">${opsDo(ti).length} neste trecho</span>${podeLancar() ? `<button class="btn primario" data-nova style="margin-left:auto"><i data-lucide="plus"></i>Nova opção</button>` : ''}</div>`;
  const varios = o.trechos.length > 1, temDias = dias.length > 1;
  // A · trechos como abas grandes (siglas em destaque, sublinhado laranja) e dias como mini calendário
  return cab + (varios ? `<div class="fa-abas" role="tablist" aria-label="Trecho">${o.trechos.map((t, i) => `<button role="tab" data-t="${i}" aria-pressed="${i === ti}"><small>Trecho ${i + 1} · ${fmt.dataCurta(t.data)}</small><b>${t.de} → ${t.para}</b><span>${opsDo(i).length} opções</span></button>`).join('')}</div>` : '')
    + (temDias ? `<div class="fa-dias"><button class="dia-c todos" data-dia="" aria-pressed="${!dia}">Todos</button>${dias.map((d) => `<button class="dia-c ${d === o.trechos[ti].data ? 'pedido' : ''}" data-dia="${d}" aria-pressed="${d === dia}"><small>${diaCurto(d)}</small><b>${d.slice(8)}</b><i>${nDia(d)}</i></button>`).join('')}</div>` : '');
}
let menuAberto = null, confirmarApagar = null, editando = null;
function menuOp(op) {
  const it = (attrs, icone, texto, cls = '') => `<button role="menuitem" class="${cls}" ${attrs}><i data-lucide="${icone}"></i>${texto}</button>`;
  if (confirmarApagar === op.id) return `<div class="menu-orc" role="menu"><p>Apagar a opção ${op.site} das ${op.sai}?</p>${it(`data-del="${op.id}"`, 'trash-2', 'Sim, apagar', 'perigo')}${it('data-cancela', 'x', 'Não')}</div>`;
  return `<div class="menu-orc" role="menu">${it(`data-link="${op.link}"`, 'external-link', 'Abrir o link do preço')}${podeLancar() ? it(`data-editar-op="${op.id}"`, 'pencil', 'Editar') + it(`data-dup="${op.id}"`, 'copy', 'Repetir com outros dados') + it(`data-pede-del="${op.id}"`, 'trash-2', 'Apagar', 'perigo') : ''}</div>`;
}
function cartaoOp(op, cheio) {
  const fora = foraDoPedido(op);
  const valor = eDinheiro(op.site) ? fmt.brl(op.preco) : `${fmt.pts(op.milhas)} + ${fmt.brl(op.taxa)}`;
  return `<article class="cartao-ref op ${cheio ? 'cheio' : ''} ${op.id === ultimaNova ? 'nova' : ''}">
    <span class="canto"><button data-menu="${op.id}" aria-haspopup="menu" aria-expanded="${menuAberto === op.id}" aria-label="Ações da opção"><i data-lucide="menu"></i></button></span>${menuAberto === op.id ? menuOp(op) : ''}
    <span class="site" data-s="${op.site}">${op.site}${cheio ? ' · menor custo' : ''}</span>
    <span class="hora">${op.sai} → ${op.chega.replace(' +1', '')}${op.chega.includes('+1') ? '<small>+1</small>' : ''}</span>
    <span class="pq">${[`${diaCurto(op.data)} ${fmt.dataCurta(op.data)}`, op.voo !== '—' && op.voo, op.voo !== '—' && op.cia !== op.voo.split(' ')[0] && op.cia].filter(Boolean).join(' · ')}</span>
    <div class="rodape tags-op"><span class="etiqueta">${op.escalas ? `${op.escalas} escala${op.escalas > 1 ? 's' : ''}` : 'direto'}</span>${op.bagagem ? '<span class="etiqueta"><i data-lucide="luggage"></i>mala</span>' : ''}${fora.map((f) => `<span class="etiqueta warn">${f}</span>`).join('')}</div>
    <div class="pe-op"><div class="valor">${eDinheiro(op.site) ? `<b>${fmt.brl(op.preco)}</b><span>em dinheiro, por pessoa</span>` : `<b>${fmt.pts(op.milhas)} <small>pts</small></b><span>+ ${fmt.brl(op.taxa)} de taxa, por pessoa</span>`}${dono ? `<span class="custo">custo total ${fmt.brl(O.custo(op, o))}</span>` : ''}</div>
      </div></article>`;
}
function opcoes() {
  const dia = KVShell.param('dia');
  const l = opsDo(trechoSel()).filter((x) => !dia || x.data === dia)
    .sort(dono ? (a, b) => O.custoPessoa(a) - O.custoPessoa(b) : (a, b) => a.data.localeCompare(b.data) || (a.milhas || 1e9) - (b.milhas || 1e9));
  return l.length ? `<div class="grade-ref">${l.map((op, i) => cartaoOp(op, dono && i === 0)).join('')}</div>` : `<div class="vazio">Nenhuma opção${dia ? ' nesse dia' : ' neste trecho'} ainda.${podeLancar() ? ' Toque em "Nova opção".' : ''}</div>`;
}


// etiquetas que não cabem numa linha: andam devagar de um lado pro outro; arrastar ou rolar para no ponto escolhido
const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
function ligarRolos() {
  app.querySelectorAll('.tags-op').forEach((r) => {
    const cabe = r.scrollWidth <= r.clientWidth + 2;
    r.classList.toggle('nao-cabe', !cabe);
    if (cabe) return;
    let pos = null, dir = 1, pausa = 1500, ultimo = null, parado = false, x0 = 0, s0 = 0, apertado = false;
    // anda por tempo (30px por segundo, pausa de 1,5s nas pontas), não por quadro: fica igual em qualquer tela
    const passo = (t) => {
      if (!r.isConnected || parado) return;
      const dt = ultimo == null ? 16 : Math.min(64, t - ultimo); ultimo = t;
      if (pausa > 0) pausa -= dt; else { pos = (pos ?? r.scrollLeft) + dir * dt * 0.03; r.scrollLeft = pos; const fim = r.scrollWidth - r.clientWidth; if ((dir > 0 && pos >= fim) || (dir < 0 && pos <= 0)) { pos = Math.max(0, Math.min(fim, pos)); dir *= -1; pausa = 1500; } }
      requestAnimationFrame(passo);
    };
    if (!calmo) requestAnimationFrame(passo);
    r.addEventListener('pointerdown', (e) => { apertado = true; x0 = e.clientX; s0 = r.scrollLeft; r.setPointerCapture(e.pointerId); });
    r.addEventListener('pointermove', (e) => { if (!apertado) return; const dx = e.clientX - x0; if (Math.abs(dx) > 4) parado = true; if (parado) r.scrollLeft = s0 - dx; });
    r.addEventListener('pointerup', () => { apertado = false; });
    r.addEventListener('wheel', () => { parado = true; }, { passive: true });
  });
}
function render() {
  app.innerHTML = topo() + filtros() + opcoes();
  document.title = `#${o.numero} ${O.destino(o)} · Rascunho K&V`;
  KVShell.icones();
  ligarRolos();
  ultimaNova = null;
}

// ---------- janelas: conferência, nova opção (lateral), marcar como pesquisado ----------
const dlg = document.createElement('dialog'); dlg.className = 'janela'; document.body.append(dlg);
const fecharJanela = () => KVShell.desfazer({ janela: 1 }, sincJanela);
dlg.addEventListener('cancel', (e) => { e.preventDefault(); tentarFechar(); });
dlg.addEventListener('click', (e) => { if (e.target === dlg) tentarFechar(); });
// painel de opção com alteração não salva: antes de fechar, pergunta se quer salvar
let inicial = null;
const sujo = () => dlg.classList.contains('lateral') && inicial != null && JSON.stringify(lerCampos()) !== inicial;
const marcarLimpo = () => { inicial = JSON.stringify(lerCampos()); };
const conf = document.createElement('dialog'); conf.className = 'janela'; conf.style.width = 'min(520px, calc(100vw - 32px))'; document.body.append(conf);
function tentarFechar() {
  if (!sujo()) { fecharJanela(); return; }
  conf.innerHTML = `<header><div style="flex:1"><h2>Salvar antes de sair?</h2><div class="sub">Você mexeu ${editando ? 'nesta opção' : 'na nova opção'} e ainda não salvou.</div></div></header>
    <footer style="justify-content:flex-end"><button class="btn" data-c="continuar">Continuar editando</button><button class="btn" data-c="descartar">Sair sem salvar</button><button class="btn primario" data-c="salvar"><i data-lucide="check"></i>Salvar</button></footer>`;
  conf.querySelectorAll('[data-c]').forEach((b) => b.onclick = () => {
    conf.close();
    if (b.dataset.c === 'descartar') { inicial = null; rascunho = rascunho && { site: rascunho.site, data: rascunho.data }; fecharJanela(); }
    if (b.dataset.c === 'salvar') { const eraEdicao = !!editando; salvarOp(); if (!eraEdicao && !dlg.querySelector('.erro')) { inicial = null; fecharJanela(); } }
    if (b.dataset.c === 'continuar') { const f = dlg.querySelector('[data-f="sai"]'); if (f) f.focus(); }
  });
  conf.showModal(); KVShell.icones(); conf.querySelector('[data-c="salvar"]').focus();
}
conf.addEventListener('cancel', (e) => { e.preventDefault(); conf.close(); });
const cab = (t, sub) => `<header><div style="flex:1"><h2>${t}</h2><div class="sub">${sub}</div></div><button class="btn icone" data-x aria-label="Fechar"><i data-lucide="x"></i></button></header>`;
const lerNum = (t) => { const n = +String(t || '').replace(/[^\d,.]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.'); return isFinite(n) && n > 0 ? n : null; };
const hora = (t) => { const mais = /\+/.test(t); const d = String(t || '').replace(/\D/g, '').slice(0, 4); if (d.length < 3) return null; const h = d.length === 3 ? '0' + d[0] : d.slice(0, 2), m = d.slice(-2); if (+h > 23 || +m > 59) return null; return `${h}:${m}${mais ? ' +1' : ''}`; };

function formOp() {
  const t = o.trechos[trechoSel()], dias = O.janelaDias(t), r = rascunho || {};
  const s = r.site || 'Smiles', din = eDinheiro(s);
  return `<div class="form-op">
    <div class="duas"><div class="campo"><label for="f-site">Site</label><select id="f-site" data-f="site" data-combo="nao">${O.sites.map((x) => `<option ${x.id === s ? 'selected' : ''}>${x.id}</option>`).join('')}</select></div>
      <div class="campo"><label for="f-dia">Dia</label><select id="f-dia" data-f="data" data-combo="nao">${dias.map((d) => `<option value="${d}" ${d === (r.data || KVShell.param('dia') || t.data) ? 'selected' : ''}>${diaCurto(d)} ${fmt.dataCurta(d)}${d === t.data ? ' (pedido)' : ''}</option>`).join('')}</select></div></div>
    <div class="duas"><div class="campo"><label for="f-sai">Sai</label><input id="f-sai" data-f="sai" inputmode="numeric" placeholder="07:40" value="${r.sai || ''}"></div><div class="campo"><label for="f-chega">Chega</label><input id="f-chega" data-f="chega" placeholder="19:10 ou 06:10+" value="${r.chega || ''}"></div></div>
    <div class="duas"><div class="campo"><label for="f-voo">Voo</label><input id="f-voo" data-f="voo" placeholder="LA 8084" value="${r.voo || ''}"></div>
      <div class="campo"><label for="f-esc">Escalas</label><select id="f-esc" data-f="escalas" data-combo="nao">${[[0, 'Direto'], [1, '1 escala'], [2, '2 ou mais']].map(([v, n]) => `<option value="${v}" ${+(r.escalas || 0) === v ? 'selected' : ''}>${n}</option>`).join('')}</select></div></div>
    ${din ? `<div class="campo"><label for="f-preco">Preço em dinheiro, por pessoa</label><input id="f-preco" data-f="preco" inputmode="decimal" placeholder="R$" value="${r.preco || ''}"></div>`
      : `<div class="duas"><div class="campo"><label for="f-mil">Milhas por pessoa</label><input id="f-mil" data-f="milhas" inputmode="numeric" placeholder="45 = 45.000" value="${r.milhas || ''}"></div><div class="campo"><label for="f-taxa">Taxa por pessoa</label><input id="f-taxa" data-f="taxa" inputmode="decimal" placeholder="R$" value="${r.taxa || ''}"></div></div>`}
    <label style="display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer"><input type="checkbox" data-f="bagagem" ${r.bagagem ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--orange)">Com mala despachada</label>
    <div class="campo"><label for="f-link">Link do preço</label><input id="f-link" data-f="link" placeholder="Colar link" value="${r.link || ''}"></div>
    <span class="lanc">${editando ? 'Enter salva a alteração.' : 'Enter salva e deixa o painel aberto pra próxima. Site e dia continuam.'}</span></div>`;
}
function lerCampos() { const v = {}; dlg.querySelectorAll('[data-f]').forEach((el) => { v[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; }); return v; }
function salvarOp() {
  const v = lerCampos(), din = eDinheiro(v.site), erros = [];
  const sai = hora(v.sai), chega = hora(v.chega);
  let milhas = lerNum(v.milhas); if (milhas && milhas < 1000) milhas *= 1000;
  const taxa = lerNum(v.taxa), preco = lerNum(v.preco);
  if (!sai) erros.push('sai'); if (!chega) erros.push('chega');
  if (din && !preco) erros.push('preco'); if (!din && !milhas) erros.push('milhas'); if (!din && !taxa) erros.push('taxa');
  dlg.querySelectorAll('[data-f]').forEach((el) => el.classList.toggle('erro', erros.includes(el.dataset.f)));
  if (erros.length) { dlg.querySelector(`[data-f="${erros[0]}"]`).focus(); return; }
  const voo = v.voo.trim().toUpperCase();
  const dados = { site: v.site, data: v.data, sai, chega, voo: voo || '—', cia: voo.split(' ')[0] || v.site, escalas: +v.escalas, bagagem: v.bagagem,
    milhas: din ? null : milhas, taxa: din ? null : taxa, preco: din ? preco : null, link: v.link.trim() || '#' };
  if (editando) { Object.assign(o.opcoes.find((x) => x.id === editando), dados); ultimaNova = editando; editando = null; rascunho = null; fecharJanela(); render(); return; }
  const op = O.addOpcao(o, { trecho: trechoSel(), ...dados, por: dono ? 'dono' : eu });
  ultimaNova = op.id; salvasAgora++;
  rascunho = { site: v.site, data: v.data };
  render(); abrirNova(); marcarLimpo();
  dlg.querySelector('[data-salvas]').innerHTML = `<i data-lucide="check" style="width:16px;height:16px"></i>${salvasAgora} ${salvasAgora > 1 ? 'salvas' : 'salva'} agora · ${op.site} ${op.sai}`;
  KVShell.icones();
  dlg.querySelector('[data-f="sai"]').focus();
}
function abrirNova() {
  const t = o.trechos[trechoSel()];
  dlg.className = 'janela lateral';
  dlg.innerHTML = cab(editando ? 'Editar opção' : 'Nova opção', `${t.de} → ${t.para} · ${O.fmtPax(o.passageiros)}`) + `<div class="corpo">${formOp()}</div>
    <footer><span class="salvas" data-salvas></span><button class="btn primario" data-salvar><i data-lucide="check"></i>${editando ? 'Salvar alteração' : 'Salvar'} <kbd>Enter</kbd></button></footer>`;
  dlg.querySelectorAll('[data-x]').forEach((b) => b.onclick = tentarFechar);
  dlg.querySelector('[data-salvar]').onclick = salvarOp;
  dlg.querySelector('[data-f="site"]').onchange = () => { rascunho = lerCampos(); abrirNova(); KVShell.icones(); dlg.querySelector('[data-f="site"]').focus(); };
  dlg.querySelectorAll('[data-f]').forEach((el) => el.addEventListener('input', () => { rascunho = lerCampos(); }));
  dlg.onkeydown = (e) => { if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') { e.preventDefault(); salvarOp(); } };
}
function sincJanela() {
  const j = KVShell.param('janela');
  if (j === 'nova') {
    if (!dlg.open || !dlg.classList.contains('lateral')) { abrirNova(); marcarLimpo(); if (!dlg.open) dlg.showModal(); KVShell.icones(); dlg.querySelector(rascunho && rascunho.sai ? '[data-f="data"]' : '[data-f="sai"]').focus(); }
    return;
  }
  dlg.onkeydown = null;
  editando = null; // fechou o painel sem salvar: a próxima vez é opção nova
  dlg.className = 'janela';
  if (j === 'conf') {
    dlg.innerHTML = cab('Lista de conferência', 'Lembra, não trava') + `<div class="corpo"><div class="conf-lista">${o.conferencia.map((c) => `<label class="${c.feito ? 'feito' : ''}"><input type="checkbox" data-c="${c.id}" ${c.feito ? 'checked' : ''}><span>${c.texto}</span></label>`).join('')}</div>
      ${dono ? '<div style="display:flex;gap:8px;margin:12px 0 16px"><input id="novo-item" placeholder="Outro item, ex.: só Latam" aria-label="Outro item" style="flex:1;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:16px;min-width:0"><button class="btn" data-add><i data-lucide="plus"></i>Pôr</button></div>' : '<div style="height:12px"></div>'}</div>
      <footer><span></span><button class="btn primario" data-x>Pronto</button></footer>`;
    dlg.querySelectorAll('[data-c]').forEach((i) => i.onchange = () => { o.conferencia.find((c) => c.id === i.dataset.c).feito = i.checked; i.closest('label').classList.toggle('feito', i.checked); render(); });
    const add = dlg.querySelector('[data-add]'); if (add) add.onclick = () => { const v = dlg.querySelector('#novo-item').value.trim(); if (v) { o.conferencia.push({ id: 'c' + Date.now(), texto: v, feito: false }); render(); dlg.close(); sincJanela(); } };
  } else if (j === 'pesquisado') {
    const falta = o.conferencia.filter((c) => !c.feito), semOp = o.trechos.map((t, i) => ({ t, i })).filter(({ i }) => !opsDo(i).length), tudo = !falta.length && !semOp.length;
    dlg.innerHTML = cab('Marcar como pesquisado?', 'Vai pro dono revisar e montar a proposta') + `<div class="corpo" style="display:grid;gap:10px;padding-bottom:14px">
      ${tudo ? '<div class="aviso ok">Tudo conferido e todos os trechos têm opção.</div>' : ''}
      ${semOp.map(({ t }) => `<div class="aviso danger">${t.de} → ${t.para} está sem nenhuma opção.</div>`).join('')}
      ${falta.length ? `<div class="aviso warn">Falta conferir:<ul style="margin:6px 0 0;padding-left:18px">${falta.map((c) => `<li>${c.texto}</li>`).join('')}</ul></div>` : ''}</div>
      <footer><button class="btn" data-x>${tudo ? 'Cancelar' : 'Voltar e conferir'}</button><button class="btn primario" data-ok><i data-lucide="check-check"></i>${tudo ? 'Marcar como pesquisado' : 'Marcar mesmo assim'}</button></footer>`;
    dlg.querySelector('[data-ok]').onclick = () => { O.mudarEtapa(o, 'pesquisado', quem); fecharJanela(); render(); };
  } else { if (dlg.open) dlg.close(); return; }
  dlg.querySelectorAll('[data-x]').forEach((b) => b.onclick = fecharJanela);
  if (!dlg.open) dlg.showModal();
  KVShell.icones();
}

// ---------- ações ----------
// menu das 3 barras nas opções
app.addEventListener('click', (e) => {
  const m = e.target.closest('[data-menu]');
  if (m) { e.stopImmediatePropagation(); menuAberto = menuAberto === m.dataset.menu ? null : m.dataset.menu; confirmarApagar = null; render(); const pri = app.querySelector('.menu-orc button'); if (pri) pri.focus(); return; }
  const l = e.target.closest('[data-link]'); if (l) { e.stopImmediatePropagation(); window.open(l.dataset.link, '_blank', 'noopener'); menuAberto = null; render(); return; }
  const pd = e.target.closest('[data-pede-del]'); if (pd) { e.stopImmediatePropagation(); confirmarApagar = pd.dataset.pedeDel; render(); return; }
  if (e.target.closest('[data-cancela]')) { e.stopImmediatePropagation(); confirmarApagar = null; render(); return; }
  const ed = e.target.closest('[data-editar-op]');
  if (ed) { e.stopImmediatePropagation(); const op = o.opcoes.find((x) => x.id === ed.dataset.editarOp); editando = op.id; menuAberto = null;
    rascunho = { site: op.site, data: op.data, voo: op.voo === '—' ? '' : op.voo, sai: op.sai, chega: op.chega.replace(' +1', '+'), escalas: op.escalas, bagagem: op.bagagem, milhas: op.milhas ? op.milhas / 1000 : '', taxa: op.taxa || '', preco: op.preco || '', link: op.link === '#' ? '' : op.link };
    render(); KVShell.irPara({ janela: 'nova' }); sincJanela(); return; }
  if (e.target.closest('[data-dup], [data-del]')) { menuAberto = confirmarApagar = null; editando = null; return; }
  if (menuAberto && !e.target.closest('.menu-orc')) { menuAberto = confirmarApagar = null; render(); }
}, true);
addEventListener('keydown', (e) => { if (e.key === 'Escape' && menuAberto && !dlg.open) { const id = menuAberto; menuAberto = confirmarApagar = null; render(); const b = app.querySelector(`[data-menu="${id}"]`); if (b) b.focus(); } });
app.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.t != null) { if (+b.dataset.t !== trechoSel()) { rascunho = null; KVShell.irPara({ t: b.dataset.t, dia: null }); render(); } }
  else if (b.dataset.dia != null) { if (b.dataset.dia !== (KVShell.param('dia') || '')) { KVShell.irPara({ dia: b.dataset.dia || null }); render(); } }
  else if (b.hasAttribute('data-nova')) { salvasAgora = 0; editando = null; rascunho = rascunho && { site: rascunho.site, data: rascunho.data }; KVShell.irPara({ janela: 'nova' }); sincJanela(); }
  else if (b.dataset.dup) { const op = o.opcoes.find((x) => x.id === b.dataset.dup); rascunho = { site: op.site, data: op.data, voo: op.voo, sai: op.sai, chega: op.chega, escalas: op.escalas, bagagem: op.bagagem, milhas: op.milhas ? op.milhas / 1000 : '', taxa: op.taxa || '', preco: op.preco || '', link: op.link }; salvasAgora = 0; KVShell.irPara({ janela: 'nova' }); sincJanela(); }
  else if (b.dataset.del) { O.removerOpcao(o, b.dataset.del); render(); }
  else if (b.hasAttribute('data-conf')) { KVShell.irPara({ janela: 'conf' }); sincJanela(); }
  else if (b.hasAttribute('data-pesquisado')) { KVShell.irPara({ janela: 'pesquisado' }); sincJanela(); }
  else if (b.hasAttribute('data-pegar')) { O.pegar(o, eu); render(); }
});
app.addEventListener('change', (e) => {
  if (e.target.id === 'passar') { O.passar(o, e.target.value); render(); }
  if (e.target.id === 'etapa') { O.mudarEtapa(o, e.target.value, quem); render(); }
});
// atalho: N abre "Nova opção" (quando não está digitando)
addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'n' && !e.target.closest('input, textarea, select') && !dlg.open && podeLancar()) { e.preventDefault(); app.querySelector('[data-nova]').click(); } });

render();
sincJanela();
KVShell.aoVoltar(() => { render(); sincJanela(); });
</script>
