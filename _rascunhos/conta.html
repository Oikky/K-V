<!doctype html>
<!-- RASCUNHO DESCARTÁVEL, rodada 3. Beneficiários abrem numa janela, com o cadastro dentro dela;
     o voltar do celular/mouse fecha a janela ou volta um passo. Base vinda da rodada 2: Escolhido na rodada 1: extrato + coluna lateral (A), com o bloco de
     beneficiários em bolinhas do painel visual (C). Clicar nas bolinhas abre a lista e o cadastro manual.
     Sem valor em R$. Variações da rodada 1 na branch rascunhos/rodada-1. ?id=c1..cN escolhe a conta. -->
<html lang="pt-BR" data-theme="escuro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conta · Rascunho K&V</title>
<link rel="stylesheet" href="shared/base.css?r=5">
<style>
  .voltar { display: inline-flex; gap: 6px; align-items: center; color: var(--text-2); text-decoration: none; font-weight: 600; margin-bottom: 14px; }
  .voltar:hover { color: var(--text); }
  .trocar { height: 42px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--surface-1); padding: 0 14px; max-width: 280px; }
  .saldo-grande { font: 800 44px/1 var(--font-brand); letter-spacing: -0.03em; }
  .saldo-grande small { font: 600 16px var(--font); color: var(--text-2); letter-spacing: 0; margin-left: 6px; }
  .extrato { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .extrato { grid-template-columns: 1fr; } }
  .mov { display: grid; grid-template-columns: 64px 1fr auto; gap: 4px 14px; padding: 12px 0; border-top: 1px solid var(--line); align-items: baseline; }
  .mov .d { color: var(--text-3); font-size: 13px; }
  .mov .q { font-weight: 700; text-align: right; } .mov .q.mais { color: var(--ok); }
  .mov .x { grid-column: 2 / -1; font-size: 13px; color: var(--text-2); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .lado { display: grid; gap: 14px; align-content: start; }
  .lado h2 { margin-bottom: 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .lado h2 small { font: 600 13px var(--font); color: var(--text-2); }
  .ben { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .ben .l { color: var(--text-3); font-size: 12.5px; text-align: right; }
  .dados { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 14px; margin: 12px 0 0; }
  .dados dt { color: var(--text-2); } .dados dd { margin: 0; font-weight: 600; text-align: right; }

  /* beneficiários em bolinhas */
  .vagas-btn { all: unset; display: block; cursor: pointer; border-radius: 14px; padding: 4px; margin: 6px -4px 0; }
  .vagas-btn:hover { background: var(--surface-2); }
  .vagas-btn:focus-visible { outline: 2px solid var(--orange); }
  .vagas-grade { display: grid; grid-template-columns: repeat(auto-fill, 30px); gap: 8px; margin: 8px 0 10px; }
  .vaga { width: 30px; height: 30px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .vaga.usada { border: 0; background: var(--teal); color: #fff; }
  .vagas-grade .vaga.estourou { background: var(--danger); color: #fff; }
  .vaga.manual { border: 0; background: var(--teal-soft); color: var(--bg); }
  .vagas-resumo { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; color: var(--text-2); }
  .regra { font-size: 13px; color: var(--text-3); margin-top: 8px; }
  .janela { border: 0; padding: 0; width: min(560px, calc(100vw - 32px)); max-height: min(720px, calc(100dvh - 48px)); border-radius: 24px; background: var(--surface-1); color: var(--text); box-shadow: var(--shadow-pop); display: flex; flex-direction: column; overflow: hidden; }
  .janela:not([open]) { display: none; }
  .janela::backdrop { background: rgb(1 8 18 / .62); }
  .janela header { display: flex; align-items: center; gap: 10px; padding: 18px 18px 12px 22px; }
  .janela header .sub { font-size: 13px; color: var(--text-2); font-weight: 600; }
  .janela .corpo { padding: 0 22px 8px; overflow-y: auto; }
  .janela footer { padding: 14px 22px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
  .novo-ben { display: grid; gap: 14px; padding: 4px 22px 8px; }
  .tag-manual { font-size: 11px; font-weight: 700; color: var(--teal-soft); margin-left: 6px; }
  .aviso { padding: 10px 12px; border-radius: 12px; font-size: 13.5px; margin-bottom: 10px; }
  .aviso.danger { background: var(--danger-bg); color: var(--danger); } .aviso.ok { background: var(--ok-bg); color: var(--ok); }
  @media (max-width: 760px) {
    .janela { width: 100vw; max-width: 100vw; max-height: 88dvh; margin: auto 0 0; border-radius: 24px 24px 0 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .janela[open] { animation: sobe .22s cubic-bezier(.2, .8, .2, 1); }
    @keyframes sobe { from { opacity: 0; transform: translateY(16px); } }
  }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="shared/dados.js?r=5"></script>
<script src="shared/shell.js?r=5"></script>
<script>
const app = KVShell.montar('contas');
const { fmt } = KV;
const params = new URLSearchParams(location.search);
const c = KV.conta(params.get('id'));
const p = KV.programa(c.programaId);
const custo = KV.custoReal(c);
let mensagem = '';
let extratoTodo = false;

function descricao(m) {
  if (m.tipo === 'clube') return `Clube ${fmt.pts(m.pontos)}`;
  if (m.tipo === 'transferencia' && m.lado === 'entrada') return `Transferência da ${m.origem}${m.bonusPct ? `, bônus de ${m.bonusPct}%` : ''}`;
  if (m.tipo === 'transferencia') return `Transferência para ${m.destino}`;
  if (m.tipo === 'emissao') return `Emissão ${m.rota}`;
  if (m.tipo === 'ajuste') return `Ajuste: ${m.obs}`;
  return (m.lado === 'entrada' ? KV.entradaTipos : KV.saidaTipos)[m.tipo].nome;
}
function detalhe(m) {
  if (m.tipo === 'emissao') return `${m.passageiros.map((x) => x.nome).join(', ')} · ${m.localizador}`;
  if (m.custo) return `Custo ${fmt.brl(m.custo)}`;
  if (m.lado === 'entrada') return `Vence em ${fmt.data(m.vence)}`;
  return '';
}
const linhaMov = (m) => `<div class="mov"><span class="d num">${fmt.dataCurta(m.data)}</span><span><b>${descricao(m)}</b></span>
  <span class="q num ${m.lado === 'entrada' ? 'mais' : ''}">${m.lado === 'entrada' ? '+' : '−'}${fmt.pts(m.pontos)}</span>
  <span class="x"><span>${detalhe(m)}</span><span class="num faint">saldo ${fmt.pts(m.saldoDepois)}</span></span></div>`;

function bolinhas(b) {
  // da mais antiga pra mais nova: quem passou do limite é sempre quem entrou por último
  const ordem = [...b.lista].sort((x, y) => x.ultima.localeCompare(y.ultima));
  return `<div class="vagas-grade">${Array.from({ length: Math.max(b.limite, b.lista.length) }, (_, i) => { const x = ordem[i];
    return `<span class="vaga ${x ? (x.manual ? 'manual' : 'usada') : ''} ${i >= b.limite ? 'estourou' : ''}" title="${x ? x.nome : 'vaga livre'}${i >= b.limite ? ' (acima do limite)' : ''}">${x ? fmt.iniciais(x.nome) : ''}</span>`; }).join('')}</div>`;
}
function resumoVagas(b) {
  const cor = b.livres === 0 ? 'var(--danger)' : b.livres <= 2 ? 'var(--warn)' : 'var(--text)';
  return `<b style="color:${cor}">${b.livres} vaga${b.livres === 1 ? '' : 's'} livre${b.livres === 1 ? '' : 's'}</b>`;
}
function blocoBenef() {
  const b = KV.beneficiarios(c);
  if (!b) return `<div class="card"><h2>Beneficiários</h2><p class="muted" style="margin:6px 0 0">A Livelo não emite passagem, só transfere. Não tem limite de beneficiários.</p></div>`;
  return `<div class="card"><h2>Beneficiários <small class="num">${b.usados} de ${b.limite}</small></h2>
    <button class="vagas-btn" id="abrir" aria-haspopup="dialog">${bolinhas(b)}
      <div class="vagas-resumo">${resumoVagas(b)}<span style="display:inline-flex;gap:4px;align-items:center">Ver pessoas<i data-lucide="chevron-right"></i></span></div></button>
    <div class="regra">${b.regra}. O titular não conta.</div></div>`;
}

// janela de beneficiários: ?ben=lista mostra as pessoas; ?ben=novo mostra o cadastro (na mesma janela)
const janela = document.createElement('dialog');
janela.className = 'janela';
janela.setAttribute('aria-labelledby', 'jt');
document.body.append(janela);
janela.addEventListener('cancel', (e) => { e.preventDefault(); KVShell.param('ben') === 'novo' ? history.back() : fecharJanela(); }); // Esc
janela.addEventListener('click', (e) => { if (e.target === janela) fecharJanela(); }); // clique fora
function fecharJanela() {
  // se estava no cadastro, sai dos dois passos (cadastro e lista) de uma vez
  if (KVShell.param('ben') === 'novo' && history.state && history.state.kv) { history.go(-2); return; }
  KVShell.desfazer({ ben: 1 }, sincronizar);
}

function desenharJanela(modo) {
  const b = KV.beneficiarios(c);
  if (modo === 'novo') {
    janela.innerHTML = `<header><button class="btn icone" data-voltar aria-label="Voltar pra lista"><i data-lucide="arrow-left"></i></button>
        <div style="flex:1"><h2 id="jt">Adicionar beneficiário</h2><div class="sub">${c.titular} · ${p.nome}</div></div></header>
      <form class="novo-ben" id="novo">
        ${b.livres === 0 ? `<div class="aviso danger">A conta está sem vaga (${b.usados}/${b.limite}). Dá pra registrar mesmo assim, mas vai passar do limite.</div>` : ''}
        <div class="campo"><label for="bnome">Nome</label><input id="bnome" required placeholder="Nome completo" autocomplete="off"></div>
        <div class="campo"><label for="bcpf">CPF</label><input id="bcpf" required inputmode="numeric" placeholder="000.000.000-00" autocomplete="off"></div>
        <div class="campo"><label for="bdata">Desde quando</label><input id="bdata" type="date" value="${KV.hoje}"><span class="ajuda">Data da emissão ou do cadastro no programa. Define quando a vaga volta.</span></div>
      </form>
      <footer><button class="btn" data-voltar>Voltar pra lista</button><button class="btn primario" type="submit" form="novo"><i data-lucide="user-plus"></i>Adicionar</button></footer>`;
    janela.querySelectorAll('[data-voltar]').forEach((x) => x.onclick = () => history.back());
    janela.querySelector('#novo').onsubmit = (e) => {
      e.preventDefault();
      const novo = { nome: janela.querySelector('#bnome').value.trim(), cpf: janela.querySelector('#bcpf').value.trim(), data: janela.querySelector('#bdata').value };
      const semVaga = KV.beneficiarios(c).livres === 0;
      KV.adicionarBeneficiario(c.id, novo);
      mensagem = semVaga ? `<div class="aviso danger">${novo.nome} entrou acima do limite. O sistema avisa, mas não bloqueia.</div>`
        : `<div class="aviso ok">${novo.nome} entrou como beneficiário. Rascunho: só na memória, some ao recarregar.</div>`;
      history.back(); // volta pra lista, que já mostra a pessoa nova
    };
    setTimeout(() => janela.querySelector('#bnome').focus(), 30);
  } else {
    janela.innerHTML = `<header><div style="flex:1"><h2 id="jt">Beneficiários</h2><div class="sub">${c.titular} · ${p.nome} · ${b.usados} de ${b.limite}</div></div>
        <button class="btn icone" data-fechar aria-label="Fechar"><i data-lucide="x"></i></button></header>
      <div class="corpo">${mensagem}${bolinhas(b)}<div class="vagas-resumo" style="margin-bottom:6px">${resumoVagas(b)}</div>
        <div class="regra" style="margin-bottom:10px">${b.regra}. O titular não conta.</div>
        ${b.lista.map((x) => `<div class="ben"><span>${x.nome}${x.manual ? '<span class="tag-manual">registrado à mão</span>' : ''}<br><span class="faint num" style="font-size:12.5px">${x.cpf}</span></span>
          <span class="l">${x.liberaEm ? `libera em<br><span class="num">${fmt.data(x.liberaEm)}</span>` : 'só por troca manual'}</span></div>`).join('') || '<p class="faint">Ninguém voou com esta conta ainda.</p>'}</div>
      <footer><span class="faint" style="font-size:13px">O voltar do celular ou do mouse fecha</span><button class="btn primario" data-novo><i data-lucide="user-plus"></i>Adicionar beneficiário</button></footer>`;
    janela.querySelector('[data-fechar]').onclick = fecharJanela;
    janela.querySelector('[data-novo]').onclick = () => { mensagem = ''; KVShell.irPara({ ben: 'novo' }); sincronizar(); };
  }
  KVShell.icones();
}

// a URL manda: desenha a página e abre/fecha a janela conforme ?ben= e ?extrato=
function sincronizar() {
  extratoTodo = KVShell.param('extrato') === 'todo';
  desenhar();
  const modo = KVShell.param('ben');
  if (modo === 'lista' || modo === 'novo') { desenharJanela(modo); if (!janela.open) janela.showModal(); }
  else if (janela.open) { janela.close(); mensagem = ''; }
}
KVShell.aoVoltar(sincronizar);

function desenhar() {
  const v = KV.vencendo(c);
  const movs = [...c.movimentos].reverse();
  app.innerHTML = `<a class="voltar" href="contas.html"><i data-lucide="arrow-left"></i>Contas de pontos</a>
    <div class="topo"><div><h1>${c.titular}</h1><div class="muted"><span class="prog" data-p="${c.programaId}">${p.nome}</span>${c.categoria ? ` · categoria ${c.categoria}` : ''}${c.clube ? ` · clube de ${fmt.pts(c.clube)}/mês` : ''}</div></div>
    <div class="acoes"><select class="trocar" aria-label="Ver outra conta" onchange="location='?id='+this.value">
      ${KV.contas().map((x) => `<option value="${x.id}" ${x === c ? 'selected' : ''}>${x.titular} · ${KV.programa(x.programaId).nome}</option>`).join('')}</select>
      <a class="btn" href="#"><i data-lucide="minus"></i>Saída</a><a class="btn primario" href="entrada.html?conta=${c.id}"><i data-lucide="plus"></i>Entrada</a></div></div>
    <div class="extrato">
      <section class="card"><div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px">
        <div><div class="muted" style="font-size:13px">Saldo</div><div class="saldo-grande num">${fmt.pts(c.saldo)}<small>pts</small></div></div>
        ${v.pontos ? `<span class="chip warn"><i data-lucide="hourglass"></i>${fmt.pts(v.pontos)} vencem em ${KV.diasAte(v.primeiro)} dias</span>` : ''}</div>
        <h2 style="margin:18px 0 4px">Extrato</h2>${(extratoTodo ? movs : movs.slice(0, 8)).map(linhaMov).join('')}
        ${movs.length > 8 ? `<button class="btn" id="todo" style="margin-top:12px">${extratoTodo ? 'Mostrar só as últimas' : `Ver as ${movs.length} movimentações`}</button>` : ''}</section>
      <aside class="lado">${blocoBenef()}
        <div class="card"><h2>Vencimentos <small>próximos lotes</small></h2>
          ${c.lotes.slice(0, 5).map((l) => { const d = KV.diasAte(l.vence); return `<div class="ben"><span>${fmt.pts(l.resta)} pts<br><span class="faint" style="font-size:12.5px">${l.origem} de ${fmt.data(l.data)}</span></span>
            <span class="l" style="${d <= 60 ? 'color:var(--warn);font-weight:700' : ''}">${fmt.data(l.vence)}${d <= 60 ? `<br>em ${d} dias` : ''}</span></div>`; }).join('')}</div>
        <div class="card"><h2>Valor da milha</h2><dl class="dados">
          <dt>Usado na cotação</dt><dd class="num">${p.valorMilha ? fmt.milha(p.valorMilha) : '—'}</dd>
          <dt>Custo real desta conta</dt><dd class="num">${custo ? fmt.milha(custo) : '—'}</dd></dl></div>
      </aside></div>`;

  const abrir = app.querySelector('#abrir');
  if (abrir) abrir.onclick = () => { mensagem = ''; KVShell.irPara({ ben: 'lista' }); sincronizar(); };
  const todo = app.querySelector('#todo');
  if (todo) todo.onclick = () => { if (extratoTodo) KVShell.desfazer({ extrato: 1 }, sincronizar); else { KVShell.irPara({ extrato: 'todo' }); sincronizar(); } };
  KVShell.icones();
}
sincronizar();
</script>
</body>
</html>
