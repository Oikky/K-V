<!doctype html>
<!-- RASCUNHO DESCARTÁVEL, rodada 4. Pergunta: como o dono ajusta valor da milha e regras de beneficiário de cada programa?
     Nada é salvo. ?v=A|B|C -->
<html lang="pt-BR" data-theme="escuro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programas · Rascunho K&V</title>
<link rel="stylesheet" href="shared/base.css?r=6">
<style>
  .edit { width: 120px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 10px; text-align: right; font-size: 15px; }
  .edit.larga { width: 100%; min-width: 220px; text-align: left; }
  .edit:focus { border-color: var(--orange); outline: none; }
  .mudou { color: var(--orange); font-weight: 700; font-size: 12.5px; }
  .rodape-form { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .barra-salvar { position: sticky; bottom: 84px; margin-top: 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 18px; background: var(--surface-2); box-shadow: var(--shadow-pop); flex-wrap: wrap; }

  /* B */
  .cards-prog { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .cp { background: var(--surface-1); border-radius: var(--r-card); padding: 20px; display: grid; gap: 14px; align-content: start; }
  .cp .linha { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .cp .explica { font-size: 14px; color: var(--text-2); line-height: 1.5; padding: 12px 14px; background: var(--surface-2); border-radius: 14px; }
  .hist { font-size: 13px; color: var(--text-3); display: grid; gap: 4px; }
  .hist div { display: flex; justify-content: space-between; }

  /* C */
  .sim { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-bottom: 30px; }
  .sim .card { display: grid; gap: 12px; }
  .valor-grande { font: 800 32px var(--font-brand); letter-spacing: -0.02em; }
  input[type=range] { width: 100%; accent-color: var(--orange); }
  .escala { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-3); margin-top: -6px; }
  .exemplo { font-size: 14px; color: var(--text-2); padding: 12px 14px; border-radius: 14px; background: var(--surface-2); }
  .exemplo b { color: var(--text); }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="shared/dados.js?r=6"></script>
<script src="shared/shell.js?r=6"></script>
<script>
const app = KVShell.montar('config');
const { fmt } = KV;
const progs = KV.programas.filter((p) => p.id !== 'livelo');
const valores = Object.fromEntries(progs.map((p) => [p.id, { valorMilha: p.valorMilha, limite: p.limite, regra: p.regra }]));
const REGRAS = { ano: 'Zera em 1º de janeiro', janela: 'Cada CPF libera 12 meses após a emissão', manual: 'Troca manual (com carência)' };
const explicar = (id) => {
  const v = valores[id];
  if (v.regra === 'ano') return `Até <b>${v.limite} pessoas diferentes</b> por ano podem voar com cada conta. Em 1º de janeiro a contagem zera.`;
  if (v.regra === 'janela') return `Até <b>${v.limite} pessoas diferentes</b> nos últimos 12 meses. Cada pessoa libera a vaga 12 meses depois da emissão dela.`;
  return `Até <b>${v.limite}</b> pessoas na categoria básica (o limite sobe com a categoria). A lista não zera: pra trocar alguém é preciso esperar 30 dias.`;
};
const lerMilha = (s) => +String(s).replace(',', '.');
const mostraMilha = (n) => n.toLocaleString('pt-BR', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
function salvo(alvo, obj) { alvo.innerHTML = `<div class="card" style="margin-top:14px"><h2 style="margin-bottom:8px">O que seria salvo</h2><div class="json">${JSON.stringify(obj, null, 2)}</div></div>`; }
const topo = (sub) => `<div class="topo"><div><h1>Programas</h1><div class="muted">${sub}</div></div></div>`;

const variantes = {
  // A: tabela editável, tudo numa tela
  A() {
    app.innerHTML = topo('Valor da milha e regras de beneficiário. A Livelo não aparece: não emite, só transfere.') + `
      <div class="tabela-wrap"><table>
        <thead><tr><th>Programa</th><th class="dir">Valor da milha</th><th class="dir">Custo real (média)</th><th class="dir">Limite de CPFs</th><th>Renovação das vagas</th></tr></thead>
        <tbody>${progs.map((p) => { const cr = KV.custoRealPrograma(p.id); return `<tr>
          <td><span class="prog" data-p="${p.id}">${p.nome}</span></td>
          <td class="dir"><input class="edit num" data-id="${p.id}" data-k="valorMilha" value="${mostraMilha(p.valorMilha)}" aria-label="Valor da milha ${p.nome}"></td>
          <td class="dir num muted">${cr ? 'R$ ' + mostraMilha(cr) : '—'}</td>
          <td class="dir"><input class="edit num" style="width:80px" data-id="${p.id}" data-k="limite" value="${p.limite}" aria-label="Limite ${p.nome}"></td>
          <td><select class="edit larga" data-id="${p.id}" data-k="regra" aria-label="Renovação ${p.nome}">${Object.entries(REGRAS).map(([k, t]) => `<option value="${k}" ${k === p.regra ? 'selected' : ''}>${t}</option>`).join('')}</select></td></tr>`; }).join('')}</tbody></table></div>
      <h2 style="margin:28px 0 10px">Categorias da Azul</h2>
      <div class="tabela-wrap" style="max-width:520px"><table><thead><tr><th>Categoria</th><th class="dir">Limite de CPFs</th></tr></thead>
        <tbody>${Object.entries(KV.categoriasAzul).map(([k, v]) => `<tr><td>${k}</td><td class="dir"><input class="edit num" style="width:80px" value="${v}" aria-label="Limite ${k}"></td></tr>`).join('')}</tbody></table></div>
      <div class="barra-salvar" id="barra" hidden><span id="resumo"></span><span style="display:flex;gap:8px"><button class="btn" id="desf">Desfazer</button><button class="btn primario" id="ok"><i data-lucide="check"></i>Salvar mudanças</button></span></div>
      <div id="salvo"></div>`;
    const mud = {};
    const atual = () => { const n = Object.keys(mud).length; app.querySelector('#barra').hidden = !n;
      app.querySelector('#resumo').innerHTML = `<b>${n} mudança${n === 1 ? '' : 's'}</b> <span class="muted">· as cotações novas passam a usar os valores novos</span>`; };
    app.querySelectorAll('[data-k]').forEach((e) => e.addEventListener('input', () => { mud[e.dataset.id + '.' + e.dataset.k] = e.value; atual(); }));
    app.querySelector('#desf').onclick = () => variantes.A();
    app.querySelector('#ok').onclick = () => salvo(app.querySelector('#salvo'), mud);
  },

  // B: um cartão por programa, com a regra explicada em português e o histórico do valor
  B() {
    app.innerHTML = topo('Cada programa com a regra explicada em palavras.') + `<div class="cards-prog">${progs.map((p) => `<section class="cp" data-card="${p.id}">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="prog" data-p="${p.id}" style="font-size:18px">${p.nome}</span><span class="mudou" hidden>alterado</span></div>
      <div class="linha"><div class="campo"><label>Valor da milha (R$)</label><span class="ajuda">Custo real médio: ${KV.custoRealPrograma(p.id) ? 'R$ ' + mostraMilha(KV.custoRealPrograma(p.id)) : '—'}</span></div>
        <input class="edit num" data-k="valorMilha" value="${mostraMilha(p.valorMilha)}" aria-label="Valor da milha"></div>
      <div class="linha"><div class="campo"><label>Limite de CPFs por conta</label></div><input class="edit num" style="width:80px" data-k="limite" value="${p.limite}" aria-label="Limite"></div>
      <div class="campo"><label>Como as vagas voltam</label><select class="edit larga" data-k="regra">${Object.entries(REGRAS).map(([k, t]) => `<option value="${k}" ${k === p.regra ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div class="explica" data-explica>${explicar(p.id)}</div>
      <div class="hist"><b style="color:var(--text-2)">Histórico do valor da milha</b>
        <div><span>desde 01/08/2026</span><span class="num">R$ ${mostraMilha(p.valorMilha)}</span></div>
        <div><span>01/03/2026 a 31/07/2026</span><span class="num">R$ ${mostraMilha(p.valorMilha + 0.001)}</span></div></div>
      <button class="btn primario" data-salvar hidden style="justify-self:start"><i data-lucide="check"></i>Salvar ${p.nome}</button>
      <div data-res></div></section>`).join('')}</div>`;
    app.querySelectorAll('[data-card]').forEach((card) => {
      const id = card.dataset.card;
      card.querySelectorAll('[data-k]').forEach((e) => e.addEventListener('input', () => {
        valores[id][e.dataset.k] = e.dataset.k === 'valorMilha' ? lerMilha(e.value) : e.dataset.k === 'limite' ? +e.value : e.value;
        card.querySelector('[data-explica]').innerHTML = explicar(id);
        card.querySelector('.mudou').hidden = false; card.querySelector('[data-salvar]').hidden = false;
      }));
      card.querySelector('[data-salvar]').onclick = () => salvo(card.querySelector('[data-res]'), { programa: id, ...valores[id] });
    });
  },

  // C: foco no valor da milha, com exemplo de quanto custa uma emissão; regras embaixo
  C() {
    app.innerHTML = topo('Mexa no valor da milha e veja na hora quanto custa uma emissão típica.') + `<div class="sim">${progs.map((p) => `<section class="card" data-sim="${p.id}">
        <span class="prog" data-p="${p.id}" style="font-size:17px">${p.nome}</span>
        <div><div class="faint" style="font-size:13px">Valor da milha</div><div class="valor-grande num" data-v>R$ ${mostraMilha(p.valorMilha)}</div></div>
        <input type="range" min="0.010" max="0.035" step="0.0005" value="${p.valorMilha}" aria-label="Valor da milha ${p.nome}">
        <div class="escala"><span>R$ 0,0100</span><span>custo real ${KV.custoRealPrograma(p.id) ? 'R$ ' + mostraMilha(KV.custoRealPrograma(p.id)) : '—'}</span><span>R$ 0,0350</span></div>
        <div class="exemplo" data-ex></div></section>`).join('')}</div>
      <h2 style="margin-bottom:10px">Beneficiários</h2>
      <div class="tabela-wrap"><table><thead><tr><th>Programa</th><th class="dir">Limite</th><th>Como as vagas voltam</th></tr></thead>
        <tbody>${progs.map((p) => `<tr><td><span class="prog" data-p="${p.id}">${p.nome}</span></td><td class="dir"><input class="edit num" style="width:80px" value="${p.limite}" aria-label="Limite ${p.nome}"></td>
          <td><select class="edit larga">${Object.entries(REGRAS).map(([k, t]) => `<option ${k === p.regra ? 'selected' : ''}>${t}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>
      <div class="rodape-form" style="margin-top:18px"><button class="btn primario" id="ok"><i data-lucide="check"></i>Salvar</button></div><div id="salvo"></div>`;
    const MILHAS = { smiles: 60000, latam: 45000, azul: 70000 };
    app.querySelectorAll('[data-sim]').forEach((card) => {
      const id = card.dataset.sim; const r = card.querySelector('input[type=range]');
      const at = () => { const v = +r.value; valores[id].valorMilha = v; card.querySelector('[data-v]').textContent = 'R$ ' + mostraMilha(v);
        card.querySelector('[data-ex]').innerHTML = `Uma emissão de <b class="num">${fmt.pts(MILHAS[id])} milhas</b> custa <b class="num">${fmt.brl(MILHAS[id] * v)}</b> + taxa.`; };
      r.oninput = at; at();
    });
    app.querySelector('#ok').onclick = () => salvo(app.querySelector('#salvo'), valores);
  },
};

KVShell.variacoes([
  { k: 'A', nome: 'Tabela editável' },
  { k: 'B', nome: 'Cartão por programa' },
  { k: 'C', nome: 'Valor da milha com exemplo' },
], (k) => variantes[k]());
</script>
</body>
</html>
